project:
  name: russian-edit-corrector
  strict_scope:
  - spelling
  - punctuation
model:
  encoder: ai-forever/ruRoberta-large
  local_files_only: true
  max_sequence_length: 64
  lora:
    enabled: false
    r: 8
    alpha: 16
    dropout: 0.05
generation:
  mode: online_ast
  seed: 13
  samples_per_epoch: 50000
  frozen_eval:
    val_examples: 2000
    test_examples: 2000
    regression_examples: 500
    coverage_examples_per_rule: 5
    output_dir: data/generated_eval
  enabled_rule_groups:
  - deterministic_orthography
  - contextual_orthography
  - morpheme
  - orthography_morphemic
  - compound_spelling
  - dictionary_typo
  - punctuation
  - syntax_punctuation
  mix:
    orthography_contextual: 0.16
    morpheme: 0.12
    compound_spelling: 0.12
    dictionary_typo: 0.12
    punctuation: 0.22
    syntax_punctuation: 0.12
    clean_identity: 0.15
    hard_negative: 0.1
  rule_weight_overrides:
    dash_subject_predicate: 0.25
    morpheme_endings: 0.75
    morpheme_hissing_vowels: 0.8
    morpheme_soft_hard_signs: 0.8
    morpheme_consonants: 0.8
    morpheme_prefixes: 0.85
    morpheme_n_nn: 0.9
    punct_detached_adverbials: 1.25
    punct_address_interjection: 1.2
    punct_bsp: 0.85
    punct_fixed_expression_guards: 0.85
  sampling_exclude_rule_ids:
  - ne_verb
  - takzhe_tak_zhe
  - tozhe_to_zhe
  - zato_za_to
  - hyphen_particles
  - hyphen_koe
  - hyphen_po_adverb
  orthography_morphemic:
    enabled: true
    weight: 0.25
    rules:
    - suffix_its_ets
    - suffix_enn_yan
    - n_nn_basic
    - morpheme_hissing_vowels
    - morpheme_soft_hard_signs
    - morpheme_root_vowels
    - morpheme_prefixes
    - morpheme_suffixes
    - morpheme_n_nn
    - morpheme_consonants
    - morpheme_endings
  rule_layers:
    enabled: true
    root: lexicon/layers
    layers: []
    groups:
      compound_spelling:
        enabled: true
        layers:
        - compound_spelling
      morpheme:
        enabled: false
        layers: []
      dictionary_typo:
        enabled: true
        layers:
        - dictionary_typo
      syntax_punctuation:
        enabled: true
        layers:
        - syntax_punctuation
  grammar:
    max_sentence_words: 28
    min_sentence_words: 3
    reject_ungrammatical: true
    max_generation_retries: 20
    use_pymorphy: true
training:
  mode: online
  batch_size: 2
  eval_batch_size: 2
  epochs: 1
  learning_rate: 5.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.06
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: false
  num_workers: 0
  progress_log_interval_seconds: 300
  progress_log_interval_steps: 1000000
  save_each_epoch: false
  validate_each_epoch: true
  token_edit_loss_weight: 1.0
  gap_punctuation_loss_weight: 1.2
  boundary_before_loss_weight: 1.0
  boundary_after_loss_weight: 1.0
  rule_loss_weight: 0.3
  smoke_steps: 3
runtime:
  max_passes: 2
  deterministic_first: true
  deterministic_lexicon: true
  deterministic_final_punctuation: true
  neural_token_edits: true
  neural_punctuation: true
  confidence_thresholds:
    token_edit: 0.7
    punctuation: 0.6
paths:
  generated_eval_dir: .tmp_e2e_check
  checkpoint_output_dir: models/checkpoints
  adapter_output_dir: .tmp_e2e_check\models\adapters
  heads_output_dir: .tmp_e2e_check\models\heads
  lexicon_dir: lexicon
