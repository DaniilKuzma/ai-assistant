        ambiguity_pair: "тоже/то_же"
        semantic_signal: "указательное местоимение уже написано раздельно"
        operation: gap_guard
        source: "то же"
        target: "то же"
        legacy_overlap: true
        compound_overlap: true
    - sub_rule_id: tozhe_demonstrative_guard
      source: "Редактор открыл то же письмо."
      target: "Редактор открыл то же письмо."
      metadata: *tozhe_guard_meta
    - sub_rule_id: tozhe_demonstrative_guard
      source: "Ассистент оставил то же решение."
      target: "Ассистент оставил то же решение."
      metadata: *tozhe_guard_meta
