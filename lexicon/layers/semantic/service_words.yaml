  hard_negative:
    - sub_rule_id: takzhe_comparison_guard
      source: "Студент сделал так же, как преподаватель."
      target: "Студент сделал так же, как преподаватель."
      metadata: &takzhe_guard_meta
        semantic_case_type: guard
        ambiguity_pair: "также/так_же"
        semantic_signal: "уже корректное сравнение с «как»"
        operation: gap_guard
        source: "так же"
        target: "так же"
        legacy_overlap: true
        compound_overlap: true
    - sub_rule_id: takzhe_comparison_guard
      source: "Редактор оформил текст так же, как эксперт."
      target: "Редактор оформил текст так же, как эксперт."
      metadata: *takzhe_guard_meta
    - sub_rule_id: takzhe_comparison_guard
      source: "Ассистент сохранил файл так же, как наставник."
      target: "Ассистент сохранил файл так же, как наставник."
      metadata: *takzhe_guard_meta
    - sub_rule_id: takzhe_comparison_guard
      source: "Эксперт проверил отчёт так же тщательно, как вчера."
      target: "Эксперт проверил отчёт так же тщательно, как вчера."
      metadata: *takzhe_guard_meta

