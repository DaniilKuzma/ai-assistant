          source: «Проект готов», — сказал редактор.
          target: «Проект готов», — сказал редактор.
          metadata:
            phenomenon: dialogue
            operation: already_correct_speech_before_author
      clean_identity:
        - sub_rule_id: clean_speech_before_author
          source: «Отчёт проверен», — сообщила Мария.
          target: «Отчёт проверен», — сообщила Мария.
          metadata:
            phenomenon: dialogue
            operation: clean_speech_before_author

