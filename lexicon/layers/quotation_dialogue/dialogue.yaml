    cases:
      positive:
        - sub_rule_id: speech_before_author_missing_quotes_comma_dash
          source_template: "{speech_cap} {speech_verb} {author_after}."
          target_template: "«{speech_cap}», — {speech_verb} {author_after}."
          gap_operations:
            - label: COMMA_DASH
              source_pattern: "{speech_last}"
          boundary_operations:
            - label: INSERT_OPEN_QUOTE_BEFORE
              source_pattern: "{speech_lower}"
            - label: INSERT_CLOSE_QUOTE_AFTER
              source_pattern: "{speech_last}"
          metadata:
            phenomenon: dialogue
            operation: speech_before_author_missing_quotes_comma_dash
        - sub_rule_id: speech_before_author_missing_comma_dash_only
          source_template: "«{speech_cap}» {speech_verb} {author_after}."
          target_template: "«{speech_cap}», — {speech_verb} {author_after}."
          gap_operations:
            - label: COMMA_DASH
              source_pattern: "{speech_last}"
          metadata:
            phenomenon: dialogue
            operation: speech_before_author_missing_comma_dash_only
      hard_negative:
