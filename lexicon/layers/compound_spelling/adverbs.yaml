# Strict compound spelling specs for adverbs.
entries:
  - rule_id: compound_adverbs
    sub_rule_id: po_adverb_omu
    operation: hyphenate
    correct: по-новому
    wrong_variants: [по новому]
    semantic_hint: adverb with по-...-ому.
    forbidden_contexts: ["по новому плану", "по новому адресу", "по новому правилу"]
    positive_templates:
      - "Редактор {wrong} оформил отчёт."
      - "Команда {wrong} настроила сервис утром."
      - "Система {wrong} показала результат."
    hard_negative_templates:
      - "Комиссия работала по новому плану."
      - "Секретарь отправил письмо по новому адресу."
      - "Редактор сверил текст по новому правилу."
    clean_templates:
      - "Редактор по-новому оформил отчёт."

  - rule_id: compound_adverbs
    sub_rule_id: po_adverb_ski
    operation: hyphenate
    correct: по-русски
    wrong_variants: [по русски]
    semantic_hint: adverb with по-...-ски.
    forbidden_contexts: ["по русской дороге", "по русскому тексту", "по русским правилам"]
    positive_templates:
      - "Студент ответил {wrong}."
      - "Редактор написал примечание {wrong} вечером."
      - "Учитель объяснил правило {wrong}."
    hard_negative_templates:
      - "Студент шёл по русской дороге."
      - "Редактор сверил замечание по русскому тексту."
      - "Комиссия проверяла работу по русским правилам."
    clean_templates:
      - "Студент ответил по-русски."

  - rule_id: compound_adverbs
    sub_rule_id: repeated_adverbs
    operation: hyphenate
    correct: тихо-тихо
    wrong_variants: [тихо тихо]
    semantic_hint: repeated adverb.
    forbidden_contexts: ["тихо и спокойно", "тихо потом", "тихо рядом"]
    positive_templates:
      - "Секретарь {wrong} закрыл дверь."
      - "В архиве {wrong} работала система."
      - "Редактор {wrong} прочитал письмо."
    hard_negative_templates:
      - "Секретарь говорил тихо и спокойно."
      - "Система сначала работала тихо потом громко."
      - "Редактор сидел тихо рядом с окном."
    clean_templates:
      - "Секретарь тихо-тихо закрыл дверь."

  - rule_id: compound_adverbs
    sub_rule_id: ordinal_adverbs
    operation: hyphenate
    correct: во-первых
    wrong_variants: [во первых]
    semantic_hint: ordinal introductory adverb.
    forbidden_contexts: ["во первых числах", "во первых строках", "во первых главах"]
    positive_templates:
      - "{Wrong}, отчёт был точным."
      - "{Wrong}, комиссия проверила сроки."
      - "{Wrong}, редактор исправил заголовок."
    hard_negative_templates:
      - "Во первых числах месяца комиссия собралась."
      - "Во первых строках письма была просьба."
      - "Во первых главах книги описан архив."
    clean_templates:
      - "Во-первых, отчёт был точным."

  - rule_id: compound_adverbs
    sub_rule_id: po_adverb_emu
    operation: hyphenate
    correct: по-прежнему
    wrong_variants: [по прежнему]
    semantic_hint: adverb with по-...-ему.
    forbidden_contexts: ["по прежнему адресу", "по прежнему плану", "по прежнему правилу"]
    positive_templates:
      - "Сервис {wrong} работал стабильно."
      - "Редактор {wrong} проверял журнал."
      - "Файл {wrong} лежал в архиве."
    hard_negative_templates:
      - "Секретарь отправил письмо по прежнему адресу."
      - "Комиссия работала по прежнему плану."
      - "Куратор сверил текст по прежнему правилу."
    clean_templates:
      - "Сервис по-прежнему работал стабильно."

  - rule_id: compound_adverbs
    sub_rule_id: po_adverb_tski
    operation: hyphenate
    correct: по-технически
    wrong_variants: [по технически]
    semantic_hint: adverb with по-...-ски in technical context.
    forbidden_contexts: ["по технической инструкции", "по техническому заданию", "по техническим причинам"]
    positive_templates:
      - "Разработчик объяснил сбой {wrong}."
      - "Тестировщик описал ошибку {wrong}."
      - "Администратор настроил сервис {wrong}."
    hard_negative_templates:
      - "Разработчик работал по технической инструкции."
      - "Отдел проверил форму по техническому заданию."
      - "Сервис остановили по техническим причинам."
    clean_templates:
      - "Разработчик объяснил сбой по-технически."

  - rule_id: compound_adverbs
    sub_rule_id: repeated_adverbs_process
    operation: hyphenate
    correct: быстро-быстро
    wrong_variants: [быстро быстро]
    semantic_hint: repeated adverb.
    forbidden_contexts: ["быстро и точно", "быстро потом", "быстро рядом"]
    positive_templates:
      - "Оператор {wrong} загрузил файл."
      - "Секретарь {wrong} открыл форму."
      - "Система {wrong} обновила статус."
    hard_negative_templates:
      - "Оператор работал быстро и точно."
      - "Система сначала работала быстро потом медленно."
      - "Файл появился быстро рядом с отчётом."
    clean_templates:
      - "Оператор быстро-быстро загрузил файл."

  - rule_id: compound_adverbs
    sub_rule_id: ordinal_adverbs_second
    operation: hyphenate
    correct: во-вторых
    wrong_variants: [во вторых]
    semantic_hint: ordinal introductory adverb.
    forbidden_contexts: ["во вторых строках", "во вторых классах", "во вторых главах"]
    positive_templates:
      - "{Wrong}, файл был загружен."
      - "{Wrong}, куратор уточнил вопрос."
      - "{Wrong}, система сохранила запись."
    hard_negative_templates:
      - "Во вторых строках письма была ошибка."
      - "Во вторых классах прошёл урок."
      - "Во вторых главах учебника есть правило."
    clean_templates:
      - "Во-вторых, файл был загружен."
