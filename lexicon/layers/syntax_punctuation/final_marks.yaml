rule_id: punct_final_marks
description: Controlled final sentence mark examples.
slots:
  actor: [Редактор, Студент, Учитель, Секретарь]
  action: [проверил, прочитал, подготовил, сохранил]
  object: [отчёт, текст, файл, план]
cases:
  positive:
    - sub_rule_id: final_dot
      source_template: "{actor} {action} {object}"
      target_template: "{actor} {action} {object}."
      gap_operations:
        - label: DOT
          source_pattern: "{object}"
      metadata:
        operation: missing_final_dot
        expected_error: missing_final_punctuation
    - sub_rule_id: final_question
      source_template: "{actor} {action} {object}"
      target_template: "{actor} {action} {object}?"
      gap_operations:
        - label: QUESTION
          source_pattern: "{object}"
      metadata:
        operation: missing_final_question
        expected_error: missing_final_punctuation
    - sub_rule_id: final_exclamation
      source_template: "{actor} {action} {object}"
      target_template: "{actor} {action} {object}!"
      gap_operations:
        - label: EXCLAMATION
          source_pattern: "{object}"
      metadata:
        operation: missing_final_exclamation
        expected_error: missing_final_punctuation
    - sub_rule_id: final_ellipsis
      source_template: "{actor} {action} {object}"
      target_template: "{actor} {action} {object}…"
      gap_operations:
        - label: ELLIPSIS
          source_pattern: "{object}"
      metadata:
        operation: missing_final_ellipsis
        expected_error: missing_final_punctuation
  hard_negative:
    - sub_rule_id: abbreviation_guard
      source: "В отчёте указали г. Москву."
      target: "В отчёте указали г. Москву."
      metadata:
        guard: abbreviation_dot
    - sub_rule_id: initials_guard
      source: "И. И. Иванов проверил отчёт."
      target: "И. И. Иванов проверил отчёт."
      metadata:
        guard: initials_dot
    - sub_rule_id: already_final_guard
      source_template: "{actor} {action} {object}."
      target_template: "{actor} {action} {object}."
      metadata:
        guard: already_final_mark
  clean_identity:
    - sub_rule_id: clean_final_statement
      source_template: "{actor} {action} {object}."
      target_template: "{actor} {action} {object}."
      metadata:
        guard: clean_final_mark
