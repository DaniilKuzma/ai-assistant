      nomn_masc_sing: {correct: организованный, wrong: организованый}
    safe_contexts:
      - {context_class: participle, template: "Комиссия утвердила {word} процесс.", construction_id: orthography_adjective_safe_context}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    correct_lemma: крашеный
    wrong_lemma: крашеный
    pos: ADJF
    gender: masc
    semantic_class: object
    correct_site: н
    wrong_site: н
    forms:
      nomn_masc_sing: {correct: крашеный, wrong: крашеный}
    hard_negative_contexts:
      - {context_class: no_dependent_word, template: "Рядом стоял {word} забор.", construction_id: orthography_adjective_safe_context}
