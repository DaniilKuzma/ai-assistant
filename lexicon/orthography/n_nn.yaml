    gender: masc
    semantic_class: abstract
    exception_group: bezvetrenny
    correct_site: нн
    wrong_site: нн
    forms:
      nomn_masc_sing: {correct: безветренный, wrong: безветренный}
    hard_negative_contexts:
      - {context_class: exception, template: "Сегодня был {word} день.", construction_id: orthography_adjective_safe_context}
    explanation_id: n_nn_basic
