rule_spec:
  rule_id: n_nn_basic
  orfogrammka_id: orthography.n_nn.basic
  family: n_nn
  pos: ADJF
  site_type: suffix
  requires: [pos, dependent_word, semantic_context, exception_group]
  correct_patterns: ["н", "нн"]
  wrong_patterns: ["нн", "н"]
  explanation_id: n_nn_basic
  model_role: context_disambiguation
lexeme_cards:
  - rule_id: n_nn_basic
    correct_lemma: крашенный
    wrong_lemma: крашеный
    pos: ADJF
    gender: masc
    semantic_class: object
    correct_site: нн
    wrong_site: н
    forms:
      nomn_masc_sing: {correct: крашенный, wrong: крашеный}
    safe_contexts:
      - {context_class: dependent_word, dependent_word: вчера, template: "Рядом стоял {word} вчера забор.", construction_id: orthography_adjective_safe_context}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    sub_rule_id: prefixed_participle
    correct_lemma: покрашенный
    wrong_lemma: покрашеный
    pos: PRTF
    gender: masc
    semantic_class: object
    correct_site: нн
    wrong_site: н
    forms:
      nomn_masc_sing: {correct: покрашенный, wrong: покрашеный, morph_features: {pos: PRTF, prefix: true}}
    safe_contexts:
      - {context_class: participle}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    sub_rule_id: short_participle
    correct_lemma: написано
    wrong_lemma: написанно
    pos: PRTS
    gender: neut
    semantic_class: document
    correct_site: н
    wrong_site: нн
    forms:
      neut_sing: {correct: написано, wrong: написанно, morph_features: {pos: PRTS, gender: neut}}
    safe_contexts:
      - {context_class: business}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    sub_rule_id: exception_n
    correct_lemma: юный
    wrong_lemma: юнный
    pos: ADJF
    gender: masc
    semantic_class: person
    correct_site: н
    wrong_site: нн
    forms:
      nomn_masc_sing: {correct: юный, wrong: юнный, morph_features: {pos: ADJF}}
    safe_contexts:
      - {context_class: educational}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    correct_lemma: жаренная
    wrong_lemma: жареная
    pos: ADJF
    gender: femn
    semantic_class: food
    correct_site: нн
    wrong_site: н
    forms:
      nomn_femn_sing: {correct: жаренная, wrong: жареная}
    safe_contexts:
      - {context_class: dependent_word, dependent_word: на масле, template: "На столе была {word} на масле картошка.", construction_id: orthography_adjective_safe_context}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    correct_lemma: организованный
    wrong_lemma: организованый
    pos: ADJF
    gender: masc
    semantic_class: abstract
    correct_site: нн
    wrong_site: н
