  - rule_id: n_nn_basic
    correct_lemma: жареная
    wrong_lemma: жареная
    pos: ADJF
    gender: femn
    semantic_class: food
    correct_site: н
    wrong_site: н
    forms:
      nomn_femn_sing: {correct: жареная, wrong: жареная}
    hard_negative_contexts:
      - {context_class: no_dependent_word, template: "На столе была {word} картошка.", construction_id: orthography_adjective_safe_context}
    explanation_id: n_nn_basic
  - rule_id: n_nn_basic
    correct_lemma: ветреный
    wrong_lemma: ветреный
    pos: ADJF
    gender: masc
    semantic_class: abstract
    exception_group: vetreny_exception
    correct_site: н
    wrong_site: н
    forms:
      nomn_masc_sing: {correct: ветреный, wrong: ветреный}
    hard_negative_contexts:
      - {context_class: exception, template: "Сегодня был {word} день.", construction_id: orthography_adjective_safe_context}
