    correct_lemma: платьице
    wrong_lemma: платьеце
    pos: NOUN
    gender: neut
    semantic_class: object
    stress_position: before_suffix
    correct_site: иц
    wrong_site: ец
    forms:
      nomn_neut_sing: {correct: платьице, wrong: платьеце}
    safe_contexts:
      - {context_class: quote, template: "В словаре указано слово «{word}».", construction_id: orthography_word_quote}
    explanation_id: suffix_its_ets
