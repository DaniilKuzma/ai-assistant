rule_spec:
  rule_id: suffix_its_ets
  orfogrammka_id: orthography.suffix_its_ets
  family: suffix_its_ets
  pos: NOUN
  site_type: suffix
  requires: [stress_position, pos]
  correct_patterns: ["-иц-", "-ец-"]
  wrong_patterns: ["-ец-", "-иц-"]
  explanation_id: suffix_its_ets
  model_role: deterministic_replace
lexeme_cards:
