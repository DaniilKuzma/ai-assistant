contexts:
  dat: &dat [{context_class: time_place, template: "Мы подошли к {word}.", vary_shell: false}]
  prep: &prep [{context_class: business, template: "В документе написали о {word}.", vary_shell: false}]
  loc: &loc [{context_class: time_place, template: "Вчера отметку оставили в {word}.", vary_shell: false}]
  gen: &gen [{context_class: business, template: "В отчете не было {word}.", vary_shell: false}]
  instr: &instr [{context_class: technical, template: "Инженер работал с {word}.", vary_shell: false}]
  generic: &generic [{context_class: educational}]
  hard: &hard [{context_class: educational}]
rule_spec:
  rule_id: morpheme_endings
  orfogrammka_id: orthography.morpheme_endings
  family: morpheme_endings
  pos: MIXED
  site_type: ending
  requires: [trusted_lexeme, pos, case, person, number]
  correct_patterns: ["падежные окончания", "личные окончания"]
  wrong_patterns: ["е/и", "а/у", "ым/ем", "ет/ит", "ут/ат"]
  explanation_id: morpheme_endings
  model_role: context_disambiguation
lexeme_cards:
