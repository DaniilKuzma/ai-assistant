  - {rule_id: morpheme_prefixes, sub_rule_id: prefix_z_s_voiced, correct_lemma: разбудить, wrong_lemma: расбудить, pos: VERB, site_type: prefix, correct_site: раз, wrong_site: рас, forms: {base: {correct: разбудить, wrong: расбудить, morph_features: {pos: VERB}}}, safe_contexts: *action, morph_features: {pos: VERB, prefix_type: z_s}}
