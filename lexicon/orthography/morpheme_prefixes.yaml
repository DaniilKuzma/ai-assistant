contexts:
  business: &business [{context_class: business}]
  educational: &educational [{context_class: educational}]
  everyday: &everyday [{context_class: everyday}]
  technical: &technical [{context_class: technical}]
  action: &action [{context_class: action}]
  hard: &hard [{context_class: educational}]
rule_spec:
  rule_id: morpheme_prefixes
  orfogrammka_id: orthography.morpheme_prefixes
  family: morpheme_prefixes
  pos: MIXED
  site_type: prefix
  requires: [trusted_lexeme, prefix_type, phonetic_context]
  correct_patterns: ["з/с", "пре", "при", "раз/рас", "роз/рос", "неизменяемые"]
  wrong_patterns: ["с/з", "при/пре", "рас/раз", "рос/роз"]
  explanation_id: morpheme_prefixes
  model_role: deterministic_replace
lexeme_cards:
