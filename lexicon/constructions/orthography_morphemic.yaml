        semantic_classes: [text]
    allowed_rule_ids: [suffix_its_ets, suffix_enn_yan, n_nn_basic, morpheme_hissing_vowels, morpheme_soft_hard_signs, morpheme_root_vowels, morpheme_prefixes, morpheme_suffixes, morpheme_n_nn, morpheme_consonants, morpheme_endings]
