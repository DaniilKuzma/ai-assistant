rules:
  context_chto_by:
    enabled: true
    family: split_join
    mutation:
      target_fragment: "чтобы"
      source_fragment: "что бы"
    positive_templates:
      - template_id: purpose_clause_basic
        target: "{subject} {verb_past}, чтобы {infinitive} {object} {time}."
      - template_id: purpose_clause_review
        target: "{subject} {verb_past}, чтобы {infinitive} {object} после встречи."
      - template_id: purpose_clause_context
        target: "{context}, чтобы {infinitive} {object}."
      - template_id: purpose_clause_deadline
        target: "Команда ждала, чтобы {subject} успел {infinitive} {object} {time}."
    hard_negative_templates:
      - template_id: concessive_trap
        text: "Что бы {subject} ни {trap_verb}, комиссия проверит {object} {time}."
      - template_id: question_trap
        text: "Что бы {subject} ни уточнял, редакция сохранит {object} {time}."
    slots:
      subject:
        values: ["редактор", "эксперт", "инспектор", "студент", "аналитик", "координатор"]
      verb_past:
        values: ["пришел", "вернулся", "собрался", "остался"]
      trap_verb:
        values: ["проверял", "уточнял", "готовил", "согласовывал"]
      infinitive:
        values: ["проверить", "уточнить", "подготовить", "согласовать"]
      object:
        values: ["документ", "отчет", "заявку", "список"]
      time:
        values: ["утром", "вечером", "после совещания", "до встречи"]
    context_injection:
      enabled: true
      mode: append_clause
      max_share: 0.5
    diversity:
      max_per_template_share: 0.25
      max_per_slot_value_share: 0.35
    seed: 101

  context_tak_zhe:
    enabled: true
    family: split_join
    mutation:
      target_fragment: "также"
      source_fragment: "так же"
    positive_templates:
      - template_id: additive_action
        target: "{subject} также {verb_past} {object} {time}."
      - template_id: additive_review
        target: "{subject} также {verb_past} {object} после заседания."
      - template_id: additive_commission
        target: "Комиссия также попросила, чтобы {subject} {verb_past} {object} {time}."
      - template_id: additive_followup
        target: "После проверки {subject} также {verb_past} {object} для архива."
    hard_negative_templates:
      - template_id: comparison_trap
        text: "Так же, как раньше, {subject} проверил {object} {time}."
      - template_id: manner_trap
        text: "{subject} сделал так же, как эксперт, и сохранил {object}."
    slots: &common_action_slots
      subject:
        values: ["редактор", "эксперт", "инспектор", "студент", "аналитик", "координатор"]
      verb_past:
        values: ["подготовил", "проверил", "согласовал", "отправил"]
      object:
        values: ["документ", "отчет", "заявку", "список"]
      time:
        values: ["утром", "вечером", "после совещания", "до встречи"]
    diversity: &standard_diversity
      max_per_template_share: 0.25
      max_per_slot_value_share: 0.35
    seed: 102

  context_to_zhe:
    enabled: true
    family: split_join
    mutation:
      target_fragment: "тоже"
      source_fragment: "то же"
    positive_templates:
      - template_id: additive_subject
        target: "{subject} тоже {verb_past} {object} {time}."
      - template_id: additive_followup
        target: "{subject} тоже {verb_past} {object} после встречи."
      - template_id: additive_archive
        target: "После заседания {subject} тоже {verb_past} {object} для архива."
      - template_id: additive_team
        target: "Команда решила, что {subject} тоже {verb_past} {object} {time}."
    hard_negative_templates:
      - template_id: same_object_trap
        text: "{subject} проверил то же {object} {time}."
      - template_id: same_task_trap
        text: "{subject} получил то же задание после встречи."
    slots: *common_action_slots
    diversity: *standard_diversity
    seed: 103

  context_za_to:
    enabled: true
    family: split_join
    mutation:
      target_fragment: "зато"
      source_fragment: "за то"
    positive_templates:
      - template_id: contrast_clause
        target: "{subject} задержался, зато {verb_past} {object} {time}."
      - template_id: contrast_result
        target: "{subject} устал, зато {verb_past} {object} после встречи."
      - template_id: contrast_archive
        target: "Проверка заняла день, зато {subject} {verb_past} {object} для архива."
      - template_id: contrast_commission
        target: "Совещание затянулось, зато {subject} {verb_past} {object} {time}."
    hard_negative_templates:
      - template_id: responsibility_trap
        text: "{subject} отвечает за то решение, которое комиссия получила {time}."
      - template_id: decision_trap
        text: "За то решение {subject} отвечал после совещания."
    slots: *common_action_slots
    diversity: *standard_diversity
    seed: 104

  context_nesmotrya:
    enabled: true
    family: split_join
    mutation:
      target_fragment: "несмотря"
      source_fragment: "не смотря"
    positive_templates:
      - template_id: concessive_basic
        target: "{subject} продолжил работу, несмотря на {obstacle}, {time}."
      - template_id: concessive_document
        target: "{subject} отправил {object}, несмотря на {obstacle}, после встречи."
      - template_id: concessive_archive
        target: "Комиссия приняла {object}, несмотря на {obstacle}, {time}."
      - template_id: concessive_review
        target: "{subject} проверил материалы, несмотря на {obstacle}, после совещания."
    hard_negative_templates:
      - template_id: gerund_trap
        text: "Не смотря по сторонам, {subject} быстро прошел через двор {time}."
      - template_id: document_trap
        text: "Не смотря в {object}, {subject} ответил на вопрос {time}."
    slots:
      <<: *common_action_slots
      obstacle:
        values: ["дождь", "задержку", "ошибку", "спор"]
    diversity: *standard_diversity
    seed: 105

  context_vsledstvie:
    enabled: true
    family: split_join
    mutation:
      target_fragment: "вследствие"
      source_fragment: "в следствие"
    positive_templates:
      - template_id: cause_basic
        target: "{object} вернули вследствие {reason} {time}."
      - template_id: cause_review
        target: "{subject} перенес встречу вследствие {reason} после заседания."
      - template_id: cause_archive
        target: "Комиссия изменила срок вследствие {reason} {time}."
      - template_id: cause_document
        target: "{subject} пересмотрел {object} вследствие {reason} после встречи."
    hard_negative_templates:
      - template_id: legal_case_trap
        text: "В следствие по делу {subject} внес {object} {time}."
      - template_id: investigation_trap
        text: "{subject} добавил {object} в следствие по делу вечером."
    slots:
      <<: *common_action_slots
      reason:
        values: ["ошибки", "задержки", "проверки", "спора"]
    diversity: *standard_diversity
    seed: 106

  tsya_soft_insert:
    enabled: false
    disabled_reason: validator_missing
    family: morphology
    positive_templates: []
    hard_negative_templates: []

  tsya_soft_delete:
    enabled: false
    disabled_reason: validator_missing
    family: morphology
    positive_templates: []
    hard_negative_templates: []

  n_nn_adjective:
    enabled: true
    family: morphology
    positive_templates:
      - template_id: adjective_report
        source: "{subject} подготовил {adjective.source} {object} {time}."
        target: "{subject} подготовил {adjective.target} {object} {time}."
      - template_id: adjective_path
        source: "{adjective.source_cap} путь занял день после заседания."
        target: "{adjective.target_cap} путь занял день после заседания."
      - template_id: adjective_review
        source: "Комиссия получила {adjective.source} {object} после встречи."
        target: "Комиссия получила {adjective.target} {object} после встречи."
      - template_id: adjective_archive
        source: "{subject} сохранил {adjective.source} {object} для архива."
        target: "{subject} сохранил {adjective.target} {object} для архива."
    hard_negative_templates: []
    slots:
      subject:
        values: ["редактор", "эксперт", "инспектор", "студент", "аналитик", "координатор"]
      adjective:
        values:
          - source: "длиный"
            target: "длинный"
            source_cap: "Длиный"
            target_cap: "Длинный"
          - source: "ценый"
            target: "ценный"
            source_cap: "Ценый"
            target_cap: "Ценный"
          - source: "истиный"
            target: "истинный"
            source_cap: "Истиный"
            target_cap: "Истинный"
          - source: "каменый"
            target: "каменный"
            source_cap: "Каменый"
            target_cap: "Каменный"
      object:
        values: ["отчет", "документ", "список", "проект"]
      time:
        values: ["утром", "вечером", "после совещания", "до встречи"]
    diversity: *standard_diversity
    seed: 107

  ni_stable_expression:
    enabled: false
    disabled_reason: validator_missing
    family: ne_ni
    positive_templates: []
    hard_negative_templates: []

  direct_speech_colon:
    enabled: true
    family: punctuation
    positive_templates:
      - template_id: author_before_speech
        source: "{subject} сказал {message} {time}."
        target: "{subject} сказал: {message} {time}."
      - template_id: author_reported
        source: "{subject} сообщил {message} после заседания."
        target: "{subject} сообщил: {message} после заседания."
      - template_id: author_wrote
        source: "{subject} написал {message} для комиссии."
        target: "{subject} написал: {message} для комиссии."
      - template_id: author_added
        source: "{subject} добавил {message} после проверки."
        target: "{subject} добавил: {message} после проверки."
    hard_negative_templates: []
    slots:
      subject:
        values: ["редактор", "автор", "эксперт", "инспектор"]
      message:
        values: ["проект готов", "отчет принят", "документ подписан", "заявка закрыта"]
      time:
        values: ["утром", "вечером", "после совещания", "до встречи"]
    diversity: *standard_diversity
    seed: 108

  direct_speech_dash:
    enabled: false
    disabled_reason: candidate_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  direct_speech_quotes:
    enabled: false
    disabled_reason: unsafe_template
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  quote_pair_balance:
    enabled: true
    family: punctuation
    positive_templates:
      - template_id: close_quote_missing
        source: "{subject} сказал: «{message} {time}."
        target: "{subject} сказал: «{message} {time}»."
      - template_id: close_quote_report
        source: "{subject} написал: «{message} после заседания."
        target: "{subject} написал: «{message} после заседания»."
      - template_id: close_quote_note
        source: "{subject} добавил: «{message} для комиссии."
        target: "{subject} добавил: «{message} для комиссии»."
      - template_id: close_quote_review
        source: "{subject} сообщил: «{message} после проверки."
        target: "{subject} сообщил: «{message} после проверки»."
    hard_negative_templates: []
    slots:
      subject:
        values: ["редактор", "автор", "эксперт", "инспектор"]
      message:
        values: ["проект готов", "отчет принят", "документ подписан", "заявка закрыта"]
      time:
        values: ["утром", "вечером", "после совещания", "до встречи"]
    diversity: *standard_diversity
    seed: 109

  bracket_pair_balance:
    enabled: true
    family: punctuation
    positive_templates:
      - template_id: close_parenthesis_missing
        source: "Проверь {object} ({note} {time}."
        target: "Проверь {object} ({note} {time})."
      - template_id: close_parenthesis_report
        source: "{subject} проверил {object} ({note} после заседания."
        target: "{subject} проверил {object} ({note} после заседания)."
      - template_id: close_parenthesis_archive
        source: "{subject} сохранил {object} ({note} для архива."
        target: "{subject} сохранил {object} ({note} для архива)."
      - template_id: close_parenthesis_commission
        source: "Комиссия получила {object} ({note} после проверки."
        target: "Комиссия получила {object} ({note} после проверки)."
    hard_negative_templates: []
    slots:
      subject:
        values: ["редактор", "автор", "эксперт", "инспектор"]
      object:
        values: ["документ", "отчет", "заявку", "список"]
      note:
        values: ["черновик", "приложение", "копия", "таблица"]
      time:
        values: ["утром", "вечером", "после совещания", "до встречи"]
    diversity: *standard_diversity
    seed: 110

  enumeration_colon:
    enabled: false
    disabled_reason: validator_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  enumeration_dash:
    enabled: false
    disabled_reason: candidate_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  explanation_colon:
    enabled: false
    disabled_reason: validator_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  semicolon:
    enabled: false
    disabled_reason: validator_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  detached_participial_comma:
    enabled: false
    disabled_reason: candidate_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  asyndetic_dash:
    enabled: false
    disabled_reason: candidate_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  consequence_dash:
    enabled: false
    disabled_reason: candidate_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []

  subject_predicate_dash:
    enabled: false
    disabled_reason: candidate_missing
    family: punctuation
    positive_templates: []
    hard_negative_templates: []
