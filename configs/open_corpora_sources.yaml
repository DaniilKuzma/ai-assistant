sources:
  download_policy:
    mode: local_first_with_controlled_downloads
    allow_downloads_env: RUSSIAN_CORRECTOR_ALLOW_SOURCE_DOWNLOADS
    max_total_download_mb: 3500
    max_source_download_mb: 1200
    cache_dir: data/external
    fail_if_insufficient_sources: true
    never_commit_downloaded_data: true

pool:
  min_clean_sentences: 150000
  max_source_share: 0.45
  max_subcorpus_share: 0.35

clean_sources:
  lenta_news:
    enabled: true
    type: corus_lenta2
    priority: 1
    domain: news
    style: neutral
    local_path: data/external/lenta-ru-news.csv.bz2
    url: https://github.com/yutkin/Lenta.Ru-News-Dataset/releases/download/v1.1/lenta-ru-news.csv.bz2
    max_download_mb: 800
    max_sentences: 150000
    min_accepted_sentences: 30000
    license_note: "Public Lenta.ru news dataset; verify before production use."

  nerus_news:
    enabled: true
    type: nerus_conllu
    priority: 1
    domain: news
    style: neutral
    local_path: data/external/nerus_lenta.conllu.gz
    url: https://storage.yandexcloud.net/natasha-nerus/data/nerus_lenta.conllu.gz
    max_download_mb: 1200
    max_sentences: 120000
    min_accepted_sentences: 30000
    license_note: "Nerus Lenta annotated corpus; verify before production use."

  opencorpora:
    enabled: true
    type: opencorpora_xml
    priority: 2
    domain: mixed_nonfiction
    style: neutral
    local_path: data/external/opencorpora/annot.opcorpora.xml
    archive_path: data/external/opencorpora/annot.opcorpora.xml.zip
    url: http://opencorpora.org/files/export/annot/annot.opcorpora.xml.zip
    max_download_mb: 300
    max_sentences: 50000
    min_accepted_sentences: 5000
    license_note: "OpenCorpora annotated corpus; verify terms before production use."

  ruwiki:
    enabled: false
    type: wikipedia_dump
    priority: 3
    domain: encyclopedic
    style: neutral
    local_path: data/external/ruwiki/ruwiki-latest-pages-articles.xml.bz2
    url: https://dumps.wikimedia.org/ruwiki/latest/ruwiki-latest-pages-articles.xml.bz2
    max_download_mb: 2500
    max_sentences: 50000
    min_accepted_sentences: 5000
    license_note: "Optional. Huge. Enable only if needed."

  taiga_news_wiki:
    enabled: false
    type: taiga
    priority: 3
    domain: news_or_wiki
    style: neutral
    local_path: data/external/taiga/
    max_download_mb: 1500
    max_sentences: 50000
    allowed_subcorpora:
      - news
      - wiki
      - wiki_2017
      - wiki_2018
      - wiki_2019
      - wiki_2020
      - GramEval_news
      - GramEval_wiki
    forbidden_subcorpora:
      - proza
      - fiction
      - stihi
      - poetry
      - social
      - subtitles
      - lj
      - livejournal
    license_note: "Optional/local-preferred. Do not use fiction/social/poetry/subtitles."
