sources:
  download_policy:
    mode: local_first_with_controlled_downloads
    allow_downloads_env: RUSSIAN_CORRECTOR_ALLOW_SOURCE_DOWNLOADS
    cache_dir: data/external
    max_total_download_mb: 6000
    max_source_download_mb: 2500
    fail_if_insufficient_sources: false
    never_commit_downloaded_data: true
    write_reports: true

pool:
  min_clean_sentences: 300000
  partial_clean_sentences: 150000
  preferred_clean_sentences: 500000
  max_source_share: 0.70
  preferred_max_source_share: 0.60
  max_subcorpus_share: 0.70
  enable_near_duplicate_filter: false
  reject_mixed_script_tokens: true
  reject_latin_confusable_inside_cyrillic_word: true
  reject_if_candidate_generator_finds_high_confidence_fix: false
  high_confidence_candidate_threshold: 0.95

clean_sources:
  lenta_news:
    enabled: true
    type: lenta_news
    priority: 1
    domain: news
    style: neutral
    local_path: data/external/lenta-ru-news.csv.bz2
    url: https://github.com/yutkin/Lenta.Ru-News-Dataset/releases/download/v1.1/lenta-ru-news.csv.bz2
    max_download_mb: 900
    max_sentences: 250000
    min_accepted_sentences: 50000
    license_note: "Open Lenta.ru news dataset; verify terms before production."

  nerus_news:
    enabled: true
    type: nerus_conllu
    priority: 1
    domain: news
    style: neutral
    local_path: data/external/nerus_lenta.conllu.gz
    url: https://storage.yandexcloud.net/natasha-nerus/data/nerus_lenta.conllu.gz
    max_download_mb: 2000
    max_sentences: 250000
    min_accepted_sentences: 50000
    license_note: "Nerus Lenta annotated corpus; verify terms before production."

  opencorpora:
    enabled: true
    type: opencorpora_xml
    priority: 2
    domain: mixed_nonfiction
    style: neutral
    local_path: data/external/opencorpora/annot.opcorpora.xml
    archive_path: data/external/opencorpora/annot.opcorpora.xml.zip
    url: http://opencorpora.org/files/export/annot/annot.opcorpora.xml.zip
    max_download_mb: 300
    max_sentences: 70000
    min_accepted_sentences: 5000
    license_note: "OpenCorpora annotated corpus; verify terms before production."

  taiga_hf_news_rest:
    enabled: true
    type: hf_dataset
    priority: 3
    domain: news
    style: neutral
    repo: cointegrated/taiga_stripped_rest
    hf_id: cointegrated/taiga_stripped_rest
    splits:
      - Interfax
      - Lenta
      - NPlus1
      - Fontanka
      - KP
    text_fields:
      - text
    max_sentences: 180000
    min_accepted_sentences: 30000
    license_note: "Taiga stripped news/rest media subcorpora from Hugging Face; excludes proza, social, subtitles, and Arzamas."

  corus_loader:
    enabled: true
    type: python_loader
    package: corus
    notes: "Utility loader, not counted as a source by itself."

  taiga_news_wiki:
    enabled: true
    type: taiga
    priority: 3
    domain: news_or_wiki
    style: neutral
    local_path: data/external/taiga/
    max_download_mb: 2500
    max_sentences: 150000
    min_accepted_sentences: 10000
    allowed_subcorpora:
      - news
      - wiki
      - wiki_2017
      - wiki_2018
      - wiki_2019
      - wiki_2020
      - grameval_news
      - grameval_wiki
      - nonfiction
      - encyclopedic
    forbidden_subcorpora:
      - proza
      - prose
      - fiction
      - stihi
      - poetry
      - social
      - subtitles
      - lj
      - livejournal
      - blogs
      - forums
      - comments
    download_policy:
      local_first: true
      require_explicit_subcorpus_url: true
    license_note: "Use only explicitly allowed Taiga subcorpora. Do not use fiction/social/poetry/subtitles."

  ruwiki:
    enabled: false
    type: wikipedia_dump
    priority: 4
    domain: encyclopedic
    style: neutral
    local_path: data/external/ruwiki/
    snapshot: "manual_pinned_required"
    url: null
    max_download_mb: 3000
    max_sentences: 100000
    license_note: "Optional. Must use pinned dated dump, not latest."

  ud_russian_taiga:
    enabled: false
    type: ud_treebank
    priority: 5
    domain: syntax_eval
    style: mixed
    local_path: data/external/ud_russian_taiga/
    max_sentences: 10000
    notes: "Optional. Not main clean source; filter social/blog style."
