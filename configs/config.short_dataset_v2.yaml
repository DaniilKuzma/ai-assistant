project:
  name: russian-edit-corrector
  strict_scope:
    - spelling
    - punctuation

model:
  primary_encoder: ai-forever/ruRoberta-large
  fallback_encoder: ai-forever/ruRoberta-large
  local_files_only: false
  max_sequence_length: 128
  max_candidates: 16
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05

dictionary:
  enabled: true
  lexicon_path: data/processed/russian_lexicon.txt
  max_candidates: 2
  min_score: 85
  max_choices_per_token: 5000
  use_second_letter_index: true
  token_cache:
    enabled: true
    max_size: 200000
  yo_e:
    enabled: false
    mode: model_required
    require_lexicon_support: true
    require_model_scoring: true

training:
  mode: short-dataset-v2-build-only
  run_model_training: false
  evaluation_split: test
  checkpoint_metric: combined_score
  max_train_examples: 50000
  max_val_examples: 5000
  max_test_examples: 5000
  epochs: 0
  feature_build:
    profile: true
    profile_sample_size: 2000
    enable_syntax: false
    dictionary_for_clean_rows: false
    dictionary_for_hard_negative_rows: false
  feature_cache:
    enabled: true
    cache_dir: data/processed/short_dataset_v2/features_cache
    include_dataset_hash: true
    include_config_hash: true
    compression: false

data:
  config_path: configs/config.short_dataset_v2.yaml
  synthetic_seed: 19
  processed_train_path: data/processed/short_dataset_v2/correction_dataset.csv.gz
  manifest_path: reports/short_dataset_v2/dataset_manifest.json
  target_total_examples: 60000
  total_examples: 60000
  train_examples: 50000
  val_examples: 5000
  test_examples: 5000
  domain: short_dataset_v2
  short_dataset_v2:
    enabled: true
    expected_total: 60000
    min_clean_pool_for_ready: 150000
    min_clean_pool_hard_min: 60000
    open_corpora_sources_path: configs/open_corpora_sources.yaml
    real_error_sources_path: configs/real_error_sources.yaml
    source_type_targets:
      synthetic_augmented_from_open_clean: 38400
      real_error_pair: 6000
      clean_identity_from_open_clean: 7800
      hard_negative_from_open_clean: 7800
    split_source_type_targets:
      train:
        synthetic_augmented_from_open_clean: 32000
        real_error_pair: 5000
        clean_identity_from_open_clean: 6500
        hard_negative_from_open_clean: 6500
      val:
        synthetic_augmented_from_open_clean: 3200
        real_error_pair: 500
        clean_identity_from_open_clean: 650
        hard_negative_from_open_clean: 650
      test:
        synthetic_augmented_from_open_clean: 3200
        real_error_pair: 500
        clean_identity_from_open_clean: 650
        hard_negative_from_open_clean: 650
    active_rule_quota:
      enabled: true
      min_total_per_active_rule: 80
      preferred_total_per_active_rule: 200
      split_minimums:
        train: 60
        val: 10
        test: 10
    rule_caps:
      max_total_per_rule_id: 2500
      max_train_per_rule_id: 2000
      max_rule_share_train: 0.10
      max_error_type_share_train: 0.35
    pool:
      min_clean_sentences: 150000
      max_source_share: 0.60
      max_subcorpus_share: 0.70
    audit:
      candidate_recall_min: 0.85
      gap_coverage_min: 0.85
      min_active_rule_count: 80
      min_clean_identity_eval_split: 500
      min_hard_negative_eval_split: 500
      require_all_source_types: true

thresholds:
  mode: conservative

paths:
  reports_dir: reports/short_dataset_v2
