      - dictionary
      - model
    rules:
      - n_nn_adjective
      - n_nn_participle
      - n_nn_deverbal_adjective
      - n_nn_short_form
    notes: "Частично покрыты dictionary-backed model_required candidates для Н/НН в прилагательных, причастиях, отглагольных прилагательных и кратких формах; синтаксический выбор остается за моделью."
  nonletter_signs:
    orfogrammka_id: "orfogrammka:2"
