  solid_hyphen_separate_adjectives:
    orfogrammka_id: "orfogrammka:3.2"
    title: "Слитное, дефисное и раздельное написание прилагательных"
    parent_group: hyphen_slitno_razdelno
    status: syntax_required
    requires:
      - morphology
      - syntax
      - dictionary
    rules: []
    notes: "Дефисные оттенки качества, терминологические и подчинительные основы не реализованы отдельными RuleSpec."
  solid_hyphen_separate_pronouns_adverbs_particles:
