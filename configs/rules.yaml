      - ner
      - syntax
      - dictionary
      - model
    rules:
      - capitalization_ner
    notes: "Географические, административные, уличные и организационные названия используют общий NER-backed capitalization candidate; применение требует scorer."
  capitalization_stylistic_pronouns:
