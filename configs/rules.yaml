    status: dictionary_model_required
    requires:
      - morphology
      - dictionary
      - model
    rules: []
    notes: "Окончания -ого/-его требуют морфологии и словарной проверки; исполняемого правила нет."
  consonants_double:
    orfogrammka_id: "orfogrammka:1.3.6"
