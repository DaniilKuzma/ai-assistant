    status: planned
    requires:
      - morphology
      - dictionary
    rules: []
    notes: "Сочетания ск/ст/зг/зд пока не имеют отдельного кандидатора."
  consonants_unpronounced:
    orfogrammka_id: "orfogrammka:1.3.2"
    title: "Правописание согласных: непроизносимые согласные"
    parent_group: checked_unchecked_consonants
    status: dictionary_model_required
    requires:
      - dictionary
      - model
    rules: []
    notes: "Нет отдельного RuleSpec для лестница/сердце-подобных случаев; словарный layer может давать candidates только при поддержке lexicon и scorer."
  consonant_clusters:
    orfogrammka_id: "orfogrammka:1.3.3"
    title: "Группы согласных на стыке значимых частей слова"
