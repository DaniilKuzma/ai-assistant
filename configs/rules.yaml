synthetic_generation:
  enabled:
    pattern_жы_жи:
      domain: orthography
      groups: [combo]
      source_datasets: [synthetic_balanced_orthography_combo, synthetic_open_corpus_combo]
    pattern_шы_ши:
      domain: orthography
      groups: [combo]
      source_datasets: [synthetic_balanced_orthography_combo, synthetic_open_corpus_combo]
    pattern_чя_ча:
      domain: orthography
      groups: [combo]
      source_datasets: [synthetic_balanced_orthography_combo, synthetic_open_corpus_combo]
    pattern_щя_ща:
      domain: orthography
      groups: [combo]
      source_datasets: [synthetic_balanced_orthography_combo, synthetic_open_corpus_combo]
    pattern_чю_чу:
      domain: orthography
      groups: [combo]
      source_datasets: [synthetic_balanced_orthography_combo, synthetic_open_corpus_combo]
    pattern_щю_щу:
      domain: orthography
      groups: [combo]
      source_datasets: [synthetic_balanced_orthography_combo, synthetic_open_corpus_combo]
    pattern_цы_ци:
      domain: orthography
      groups: [ci]
      source_datasets: [synthetic_balanced_orthography_ci, synthetic_open_corpus_ci]
    pattern_жо_же:
      domain: orthography
      groups: [hissing_o_e]
      source_datasets: [synthetic_balanced_orthography_hissing_o_e, synthetic_open_corpus_hissing_o_e]
    pattern_шо_ше:
      domain: orthography
      groups: [hissing_o_e]
      source_datasets: [synthetic_balanced_orthography_hissing_o_e, synthetic_open_corpus_hissing_o_e]
    pattern_чо_че:
      domain: orthography
      groups: [hissing_o_e]
      source_datasets: [synthetic_balanced_orthography_hissing_o_e, synthetic_open_corpus_hissing_o_e]
    pattern_що_ще:
      domain: orthography
      groups: [hissing_o_e]
      source_datasets: [synthetic_balanced_orthography_hissing_o_e, synthetic_open_corpus_hissing_o_e]
    cy_exception:
      domain: orthography
      groups: [ci]
      source_datasets: [synthetic_balanced_orthography_ci, synthetic_open_corpus_ci]
    sdelat_prefix:
      domain: orthography
      groups: [prefix_z_s]
      source_datasets: [synthetic_balanced_orthography_prefix_z_s, synthetic_open_corpus_prefix_z_s]
    prefix_z_to_s:
      domain: orthography
      groups: [prefix_z_s]
      source_datasets: [synthetic_balanced_orthography_prefix_z_s, synthetic_open_corpus_prefix_z_s]
    prefix_s_to_z:
      domain: orthography
      groups: [prefix_z_s]
      source_datasets: [synthetic_balanced_orthography_prefix_z_s, synthetic_open_corpus_prefix_z_s]
    final_punctuation_default:
      domain: punctuation
      groups: [final_punctuation]
      source_datasets: [synthetic_balanced_punctuation_final_punctuation, synthetic_open_corpus_final_punctuation]
    ne_verb:
      domain: orthography
      groups: [ne_verb]
      source_datasets: [synthetic_balanced_orthography_ne_verb, synthetic_open_corpus_ne_verb]
    tsya_soft_delete:
      domain: orthography
      groups: [tsya]
      source_datasets: [synthetic_balanced_orthography_tsya, synthetic_open_corpus_tsya]
    tsya_soft_insert:
      domain: orthography
      groups: [tsya]
      source_datasets: [synthetic_balanced_orthography_tsya, synthetic_open_corpus_tsya]
    hyphen_particles:
      domain: orthography
      groups: [hyphen_particles]
      source_datasets: [synthetic_open_corpus_hyphen_particles]
    hyphen_koe_koy:
      domain: orthography
      groups: [hyphen_koe_koy]
      source_datasets: [synthetic_open_corpus_hyphen_koe_koy]
    hyphen_po_adverbs:
      domain: orthography
      groups: [hyphen_po_adverbs]
      source_datasets: [synthetic_open_corpus_hyphen_po_adverbs]
    pol_polu_compounds:
      domain: orthography
      groups: [hyphen]
      source_datasets: [synthetic_open_corpus_hyphen]
    dictionary_fuzzy:
      domain: orthography
      groups: [dictionary_fuzzy]
      source_datasets: [synthetic_balanced_orthography_dictionary_fuzzy, synthetic_open_corpus_dictionary_fuzzy]
    punctuation_delete_replace:
      domain: punctuation
      groups: [delete_replace, punctuation_noise]
      source_datasets: [synthetic_balanced_punctuation_delete_replace, synthetic_balanced_punctuation_punctuation_noise]
  disabled:
    yo_e_candidate: "Disabled by default because е/ё requires opt-in lexicon support and model scoring."
    capitalization_ner: "Requires NER-backed spans; synthetic corruption is unsafe without labeled entity boundaries."
    abbreviation_case_protection: "Covered by hard negatives; corruption of valid abbreviations would train unsafe casing."
    capitalization_sentence_start: "Covered by hard negatives; broad lowercase sentence-start corruption is too noisy without discourse context."
    neural_punctuation: "Metadata-only neural punctuation bucket; no executable bounded rule_id."

orthography:
  letter_vowels_not_after_hissing_c:
    orfogrammka_id: "orfogrammka:1.1.1"
    title: "Правила употребления букв: гласные не после шипящих и ц"
    parent_group: hissing_spelling
    status: partial
    requires:
      - dictionary
      - model
    rules:
      - yo_e_candidate
    notes: "Частично покрыто opt-in кандидатом е/ё через lexicon+model; policy выключена по умолчанию, остальные гласные вне шипящих и ц остаются dictionary_model_required."
  letter_basic_hissing_vowel_patterns:
    orfogrammka_id: "orfogrammka:1.1.2"
    title: "Правила употребления букв: базовые гласные после шипящих и ц"
    parent_group: hissing_spelling
    status: implemented
    tags:
      - orthography
    requires:
      - dictionary
    rules:
      - pattern_жы_жи
      - pattern_шы_ши
      - pattern_чя_ча
      - pattern_щя_ща
      - pattern_чю_чу
      - pattern_щю_щу
      - pattern_цы_ци
      - pattern_жо_же
      - pattern_шо_ше
      - pattern_чо_че
      - pattern_що_ще
      - cy_exception
    tests:
      - tests/test_orthography_rule_generation.py::test_candidate_generator_emits_spelling_pattern_candidates_for_hundreds_of_forms
      - tests/test_synthetic_generator.py::test_cha_shcha_rule_generates_corruption_and_candidate_with_same_rule_id
    notes: "Покрыты реальные словарно проверяемые кандидаты для жи/ши, ча/ща, чу/щу, ци/цы и о/е после шипящих; восстановление ё не заявляется."
  letter_y:
    orfogrammka_id: "orfogrammka:1.1.3"
    title: "Правила употребления букв: буква й"
    parent_group: dictionary_words
    status: planned
    requires:
      - dictionary
    rules: []
    notes: "Отдельного RuleSpec для буквы й нет; нужен словарный или морфемный слой."
  hard_soft_signs:
    orfogrammka_id: "orfogrammka:1.1.4.1-1.1.4.2"
    title: "Буквы ъ и ь: разделительные знаки и знак мягкости"
    parent_group: hard_soft_sign
    status: partial
    requires:
      - dictionary
    rules:
      - soft_to_hard_sign
      - missing_hard_sign
    notes: "Покрыт только ъ после приставки перед е/ю/я и замена ошибочного ь на ъ; остальные функции ь не реализованы."
  soft_sign_grammatical_forms:
    orfogrammka_id: "orfogrammka:1.1.4.3-1.1.4.4"
    title: "Буква ь в грамматических формах"
    parent_group: hard_soft_sign
    status: model_required
    tags:
      - orthography
      - morphological_rules
    requires:
      - morphology
      - syntax
      - model
    rules:
      - tsya_soft_delete
      - tsya_soft_insert
    notes: "Есть кандидаты для -тся/-ться, но выбор требует контекста и модельного скоринга; другие грамматические функции ь не покрыты."
  unstressed_root_vowels:
    orfogrammka_id: "orfogrammka:1.2.1"
    title: "Написание значимых частей слова: безударные гласные в корнях"
    parent_group: checked_unchecked_vowels
    status: partial
    requires:
      - dictionary
      - model
    rules:
      - dictionary_fuzzy
    notes: "Частично покрыто словарным fuzzy/edit-distance кандидатором через lexicon+model; это не морфемное правило проверяемых гласных."
  alternating_roots:
    orfogrammka_id: "orfogrammka:1.2.2.1"
    title: "Написание отдельных корней: чередующиеся гласные"
    parent_group: roots
    status: planned
    requires:
      - morphology
      - dictionary
    rules: []
    notes: "Корни с чередованием а/о и и/е требуют отдельного морфемного/словарного слоя."
  difficult_root_vowels:
    orfogrammka_id: "orfogrammka:1.2.2.2"
    title: "Трудные случаи написания корневых гласных"
    parent_group: roots
    status: dictionary_model_required
    requires:
      - dictionary
      - model
    rules: []
    notes: "Трудные корневые гласные отражены как словарно-модельная зона; RuleSpec отсутствует."
  prefix_vowels:
    orfogrammka_id: "orfogrammka:1.2.3"
    title: "Безударные гласные в приставках, включая пре-/при- и раз-/роз-"
    parent_group: prefix_spelling
    status: partial
    requires:
      - dictionary
      - model
    rules:
      - prefix_pre_pri
    notes: "Частично покрыты bounded candidates для начальных при-/пре-; выбор написания требует словаря и модели, другие приставочные гласные не реализованы."
  suffix_vowels:
    orfogrammka_id: "orfogrammka:1.2.4"
    title: "Безударные гласные и особенности написания суффиксов"
    parent_group: suffixes
    status: dictionary_model_required
    requires:
      - morphology
      - dictionary
      - model
    rules: []
    notes: "Суффиксы -енн/-ян, -ек/-ик, -ыва/-ива и другие подгруппы Орфограммки пока не выделены в правила."
  fleeting_connecting_vowels:
    orfogrammka_id: "orfogrammka:1.2.5-1.2.6"
    title: "Беглые и соединительные гласные"
    parent_group: roots
    status: planned
    requires:
      - morphology
      - dictionary
    rules: []
    notes: "Нет отдельного кандидатора для беглых и соединительных гласных."
  case_endings:
    orfogrammka_id: "orfogrammka:1.2.7"
    title: "Безударные гласные в падежных окончаниях"
    parent_group: endings
    status: dictionary_model_required
    tags:
      - orthography
      - morphological_rules
      - syntactic_rules
    requires:
      - morphology
      - syntax
      - dictionary
      - model
    rules: []
    notes: "Падежные окончания требуют морфологии, согласования и контекста."
  verb_endings:
    orfogrammka_id: "orfogrammka:1.2.8"
    title: "Безударные гласные в глагольных формах"
    parent_group: endings
    status: dictionary_model_required
    requires:
      - morphology
      - dictionary
      - model
    rules: []
    notes: "Гласные в окончаниях и инфинитиве перед -ть не имеют отдельного RuleSpec."
  ne_ni_particles:
    orfogrammka_id: "orfogrammka:1.2.9"
    title: "Частицы не и ни"
    parent_group: ne_ni
    status: partial
    tags:
      - orthography
      - context_pairs
      - morphological_rules
    requires:
      - morphology
      - syntax
      - model
    rules:
      - ne_verb
      - ni_stable_expression
    notes: "Частично покрыты model_required candidates для не с глаголами и ограниченного набора устойчивых не/ни-конструкций; автоматического исправления нет."
  consonants_prefix_z_s:
    orfogrammka_id: "orfogrammka:1.3.1.4"
    title: "Правописание согласных: приставки на з-/с-"
    parent_group: prefix_spelling
    status: implemented
    tags:
      - orthography
    requires:
      - dictionary
    rules:
      - sdelat_prefix
      - prefix_z_to_s
      - prefix_s_to_z
    tests:
      - tests/test_orthography_rule_generation.py::test_candidate_generator_emits_spelling_pattern_candidates_for_hundreds_of_forms
    notes: "Покрыты словарно проверяемые кандидаты для з-/с- перед глухими, звонкими, сонорными и гласными."
  consonants_voiced_devoiced:
    orfogrammka_id: "orfogrammka:1.3.1.1"
    title: "Правописание согласных: парные глухие и звонкие"
    parent_group: checked_unchecked_consonants
    status: dictionary_model_required
    requires:
      - dictionary
      - model
    rules: []
    notes: "Общее правило парных согласных за пределами приставок не реализовано; lexicon-backed candidate layer может находить варианты opportunistically без deterministic auto-correct."
  consonants_unchecked:
    orfogrammka_id: "orfogrammka:1.3.1.2"
    title: "Правописание согласных: непроверяемые согласные"
    parent_group: checked_unchecked_consonants
    status: dictionary_model_required
    requires:
      - dictionary
      - model
    rules: []
    notes: "Непроверяемые согласные требуют словаря; общий lexicon-backed layer может дать кандидата, но отдельного deterministic RuleSpec нет."
  consonants_sk_st_zg_zd:
    orfogrammka_id: "orfogrammka:1.3.1.3"
    title: "Слова с сочетаниями согласных ск, ст, зг, зд"
