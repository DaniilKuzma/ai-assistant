    requires:
      - morphology
      - dictionary
    rules: []
    notes: "Сочетания тс/дс/тц/дц, тч, сч/зч и другие стыки пока не реализованы."
  consonants_ch_sh_before_n_t:
    orfogrammka_id: "orfogrammka:1.3.4"
    title: "Буквы ч и ш перед н и т"
    parent_group: checked_unchecked_consonants
    status: dictionary_model_required
    requires:
      - dictionary
      - model
    rules: []
    notes: "Ч/ш перед н/т выделены как отдельный словарно-модельный класс; RuleSpec отсутствует."
  consonants_g_ogo_ego:
    orfogrammka_id: "orfogrammka:1.3.5"
