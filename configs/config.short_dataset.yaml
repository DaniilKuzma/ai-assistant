project:
  name: russian-edit-corrector
  strict_scope:
    - spelling
    - punctuation

model:
  primary_encoder: ai-forever/ruRoberta-large
  fallback_encoder: ai-forever/ruRoberta-large
  local_files_only: false
  max_sequence_length: 128
  max_candidates: 16
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05

dictionary:
  enabled: true
  lexicon_path: data/processed/russian_lexicon.txt
  max_candidates: 2
  min_score: 85
  yo_e:
    enabled: false
    mode: model_required
    require_lexicon_support: true
    require_model_scoring: true

training:
  mode: short-dataset-build-only
  run_model_training: false
  evaluation_split: test
  checkpoint_metric: combined_score
  max_train_examples: 50000
  max_val_examples: 5000
  max_test_examples: 5000
  batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 0
  learning_rate: 0.0001
  mixed_precision: true
  show_progress: true

data:
  config_path: configs/config.short_dataset.yaml
  synthetic_seed: 17
  processed_train_path: data/processed/short_dataset/correction_dataset.csv.gz
  manifest_path: reports/short_dataset/dataset_manifest.json
  target_total_examples: 60000
  total_examples: 60000
  train_examples: 50000
  val_examples: 5000
  test_examples: 5000
  clean_identity_ratio: 0.05
  punctuation_hard_negative_clean_ratio: 0.50
  val_ratio: 0.0833333333
  test_ratio: 0.0833333333
  domain: short_dataset_v1
  use_external_sources: true
  external_local_files_only: true
  max_external_examples: 1500
  external_sources:
    - name: mendeley_russian_spelling_train
      type: csv
      path: data/raw/external/train_pairs.csv
      trusted_word_pairs: true
      max_examples: 1500
    - name: mendeley_russian_spelling_test
      type: csv
      path: data/raw/external/test_pairs.csv
      trusted_word_pairs: true
      max_examples: 1500
  clean_corpus:
    enabled: true
    cache_path: data/raw/clean_corpus_sentences.txt.gz
    rebuild_cache: false
    min_cached_sentences: 3000
    max_source_sentences: 1200000
    show_progress: false
  debug_clean_texts:
    - Я не знаю, что делать.
    - Во-первых, это важно.
    - Чистый текст.
  short_dataset:
    enabled: true
    source_type_targets:
      synthetic: 52500
      real: 1500
      clean: 3000
      hard_negative: 3000
    split_source_type_targets:
      train:
        synthetic: 43750
        real: 1250
        clean: 2500
        hard_negative: 2500
      val:
        synthetic: 4375
        real: 125
        clean: 250
        hard_negative: 250
      test:
        synthetic: 4375
        real: 125
        clean: 250
        hard_negative: 250
    synthetic_error_type_targets:
      spelling: 18500
      punctuation: 15500
      final_punctuation: 2500
      split_join: 10000
      hyphen: 6000
    unknown_max_ratio: 0.05
    active_recall_min: 0.85
    active_rule_failure_threshold: 0.80
    train_error_type_max_ratio: 0.35
    train_rule_id_max_ratio: 0.15

thresholds:
  mode: conservative
  conservative:
    default_threshold: 0.90
    spelling_threshold: 0.92
    punctuation_threshold: 0.90
    comma_threshold: 0.90
    final_punctuation_threshold: 0.88
    colon_threshold: 0.92
    dash_threshold: 0.94
    semicolon_threshold: 0.95
    quote_threshold: 0.94
    bracket_threshold: 0.94
    punctuation_delete_threshold: 0.98
    split_join_threshold: 0.95
    dictionary_threshold: 0.95
    context_pair_threshold: 0.995
    tsya_threshold: 0.995
    ne_adjective_threshold: 0.99995
    ne_participle_threshold: 0.99995
    ne_adverb_threshold: 0.99995
    comma_subordinate_threshold: 0.92
    introductory_word_threshold: 0.94
    introductory_comma_threshold: 0.97
    dash_subject_predicate_threshold: 0.96
    hyphen_threshold: 0.95
    case_threshold: 0.90
    quote_open_threshold: 0.99999
    quote_close_threshold: 0.99999
    quote_pair_balance_threshold: 0.995
    bracket_pair_balance_threshold: 0.995
    capitalization_ner_threshold: 0.999999
    capitalization_sentence_start_threshold: 0.98
    n_nn_adjective_threshold: 0.995
    n_nn_participle_threshold: 0.999
    n_nn_short_form_threshold: 0.99995
    subject_predicate_dash_threshold: 0.9999
    direct_speech_colon_threshold: 0.995
    direct_speech_quotes_threshold: 0.995
    comma_conjunction_threshold: 0.995
    punctuation_delete_replace_threshold: 0.9999

paths:
  reports_dir: reports/short_dataset
