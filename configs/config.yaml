project:
  name: russian-edit-corrector
  strict_scope:
  - spelling
  - punctuation
model:
  primary_encoder: ai-forever/ruRoberta-large
  fallback_encoder: ai-forever/ruRoberta-large
  local_files_only: false
  max_sequence_length: 128
  max_candidates: 16
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
dictionary:
  enabled: true
  lexicon_path: data/processed/russian_lexicon.txt
  max_candidates: 2
  min_score: 85
  max_choices_per_token: 5000
  use_second_letter_index: true
  token_cache:
    enabled: true
    max_size: 200000
  yo_e:
    enabled: false
    mode: model_required
    require_lexicon_support: true
    require_model_scoring: true
training:
  mode: train
  run_model_training: true
  evaluation_split: val
  checkpoint_metric: combined_score
  max_train_examples: 80000
  max_val_examples: 10000
  max_test_examples: 10000
  batch_size: 128
  gradient_accumulation_steps: 1
  epochs: 1
  learning_rate: 5.0e-05
  mixed_precision: true
  show_progress: true
  progress_log_every_steps: 1000
  word_loss_weight: 1.3
  punctuation_loss_weight: 1.2
  punctuation_action_loss_weight: 0.8
  punctuation_focal_gamma: 1.5
  punctuation_action_focal_gamma: 1.0
  punctuation_label_weights:
  - 0.25
  - 2.0
  - 1.2
  - 3.0
  - 3.0
  - 4.0
  - 4.0
  - 5.0
  - 4.0
  - 4.0
  - 4.0
  - 4.0
  - 4.0
  punctuation_action_weights:
  - 0.25
  - 0.5
  - 2.0
  - 3.0
  - 3.0
  confidence_loss_weight: 0.3
  error_type_loss_weight: 0.5
  feature_build:
    profile: true
    profile_sample_size: 2000
    enable_syntax: false
    dictionary_for_clean_rows: false
    dictionary_for_hard_negative_rows: false
  feature_cache:
    enabled: true
    cache_dir: data/processed/features_cache
    include_dataset_hash: true
    include_config_hash: true
    compression: false
evaluation:
  batch_size: 256
  fast_during_training: true
  max_eval_examples_per_epoch: 1000
  full_eval_after_training: true
  full_eval_examples: 5000
  write_detailed_reports_during_training: false
  write_accepted_rejected_during_training: false
  write_score_distribution_during_training: false
  write_rule_worse_examples_during_training: false
data:
  synthetic_seed: 13
  processed_train_path: data/processed/correction_dataset.csv.gz
  manifest_path: data/processed/dataset_manifest.json
  target_total_examples: 100000
  total_examples: 100000
  train_examples: 80000
  val_examples: 10000
  test_examples: 10000
  clean_identity_ratio: 0.1
  punctuation_hard_negative_clean_ratio: 0.25
  val_ratio: 0.05
  test_ratio: 0.05
  domain: training_dataset
  use_external_sources: true
  external_local_files_only: true
  max_external_examples: 10000
  external_sources:
  - name: rus_spell_gold
    type: hf_jsonl
    repo: RussianNLP/RuSpellGold
    files:
    - data/complete_test/test.json
    max_examples: 2000
  - name: ai_forever_spellcheck_punctuation
    type: hf_jsonl
    repo: ai-forever/spellcheck_punctuation_benchmark
    files:
    - data/RUSpellRU/train.json
    - data/RUSpellRU/test.json
    - data/MultidomainGold/train.json
    - data/MultidomainGold/test.json
    max_examples: 6000
  - name: lorugec_val
    type: m2
    path: data/raw/external/LORuGEC.val.m2
    url: https://raw.githubusercontent.com/ReginaNasyrova/LORuGEC/main/LORuGEC.val.m2
    max_examples: 1000
  - name: lorugec_test
    type: m2
    path: data/raw/external/LORuGEC.test.m2
    url: https://raw.githubusercontent.com/ReginaNasyrova/LORuGEC/main/LORuGEC.test.m2
    max_examples: 1000
  - name: github_typo_corpus_ru
    type: github_typo_jsonl_gz
    path: data/raw/external/github-typo-corpus.v1.0.0.jsonl.gz
    url: https://github-typo-corpus.s3.amazonaws.com/data/github-typo-corpus.v1.0.0.jsonl.gz
    max_examples: 500
  - name: mendeley_russian_spelling_test
    type: csv
    path: data/raw/external/test_pairs.csv
    url: https://data.mendeley.com/public-files/datasets/mpwdrr6y3v/files/1ca956a8-3bf7-46e6-8478-04f29856f4e8/file_downloaded
    trusted_word_pairs: true
    max_examples: 5000
  - name: mendeley_russian_spelling_train
    type: csv
    path: data/raw/external/train_pairs.csv
    url: https://data.mendeley.com/public-files/datasets/mpwdrr6y3v/files/d7763910-8ea7-459b-8ec1-946c39e03ef9/file_downloaded
    trusted_word_pairs: true
    max_examples: 5000
  clean_corpus:
    enabled: true
    cache_path: data/raw/clean_corpus_sentences.txt.gz
    rebuild_cache: false
    min_cached_sentences: 10000
    max_source_sentences: 1200000
    sources:
    - name: leipzig_news
      type: leipzig
      corpus_ids:
      - rus_news_2022_1M
      - rus_news_2021_1M
      - rus_news_2020_1M
      max_sentences: 180000
    - name: leipzig_wikipedia
      type: leipzig
      corpus_ids:
      - rus_wikipedia_2021_1M
      - rus_wikipedia_2016_1M
      max_sentences: 90000
    - name: taiga_rest
      type: hf_dataset
      repo: cointegrated/taiga_stripped_rest
      splits:
      - Interfax
      - Lenta
      - NPlus1
      - Fontanka
      - Arzamas
      - KP
      text_fields:
      - text
      max_sentences: 90000
    - name: taiga_proza_filtered
      type: hf_dataset
      repo: cointegrated/taiga_stripped_proza
      splits:
      - train
      text_fields:
      - text
      max_sentences: 15000
      strict_formal_filter: true
    - name: ud_russian_taiga
      type: ud_conllu
      urls:
      - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-train.conllu
      - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-dev.conllu
      - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-test.conllu
      max_sentences: 25000
    - name: opencorpora
      type: opencorpora_xml_zip
      url: https://opencorpora.org/files/export/annot/annot.opcorpora.xml.zip
      max_sentences: 40000
    - name: tatoeba_russian
      type: tatoeba_tsv
      url: https://downloads.tatoeba.org/exports/sentences.tar.bz2
      max_sentences: 30000
  debug_clean_texts:
  - Я не знаю, что делать.
  - Во-первых, это важно.
  - Чистый текст.
  config_path: configs/config.yaml
  exact_split_sizes:
    train: 80000
    val: 10000
    test: 10000
  training_dataset:
    enabled: true
    requested_total: 100000
    expected_total: 100000
    smoke:
      enabled: false
      requested_total: 60000
      split_sizes:
        train: 50000
        val: 5000
        test: 5000
      verdict: READY_FOR_SMOKE_ONLY
    min_clean_pool_for_ready: 150000
    min_clean_pool_hard_min: 60000
    open_corpora_sources_path: configs/open_corpora_sources.yaml
    real_error_sources_path: configs/real_error_sources.yaml
    source_type_targets:
      synthetic_augmented_from_open_clean: 72000
      real_error_pair: 4000
      clean_identity_from_open_clean: 12000
      hard_negative_from_open_clean: 12000
    split_source_type_targets:
      train:
        synthetic_augmented_from_open_clean: 57600
        real_error_pair: 3200
        clean_identity_from_open_clean: 9600
        hard_negative_from_open_clean: 9600
      val:
        synthetic_augmented_from_open_clean: 7200
        real_error_pair: 400
        clean_identity_from_open_clean: 1200
        hard_negative_from_open_clean: 1200
      test:
        synthetic_augmented_from_open_clean: 7200
        real_error_pair: 400
        clean_identity_from_open_clean: 1200
        hard_negative_from_open_clean: 1200
    active_rule_quota:
      enabled: true
      strategy: tiered_canonical
      min_total_per_active_rule: 200
      preferred_total_per_active_rule: 1000
      split_minimums: {}
      tiers:
        stable_core:
          min_total_per_rule: 300
          preferred_total_per_rule: 700
          max_total_per_rule: 2500
        activation:
          min_total_per_rule: 500
          preferred_total_per_rule: 1000
          max_total_per_rule: 2500
        bounded_activation:
          min_total_per_rule: 200
          preferred_total_per_rule: 500
          max_total_per_rule: 1500
      risky_lexical:
        rule_ids:
        - dictionary_fuzzy
        - swapped_letters_candidate
        - double_consonant_candidate
        - missing_letter_candidate
        - extra_letter_candidate
        - keyboard_typo_candidate
        min_total_per_rule: 200
        preferred_total_per_rule: 500
        max_total_per_rule: 1200
    rule_caps:
      max_total_per_rule_id: 2500
      max_train_per_rule_id: 2000
      max_rule_share_train: 0.1
      max_error_type_share_train: 0.35
    pool:
      min_clean_sentences: 150000
      max_source_share: 0.6
      max_subcorpus_share: 0.7
    audit:
      candidate_recall_min: 0.85
      gap_coverage_min: 0.85
      synthetic_min: 70000
      min_active_rule_count: 1
      min_clean_identity_eval_split: 500
      min_hard_negative_eval_split: 500
      min_rows_for_template_gates: 1000
      min_rows_for_candidate_gates: 1000
      min_rows_for_eval_source_split_gates: 1000
      require_all_source_types: true
  training_dataset_core:
    enabled: true
    requested_total: 100000
    expected_total: 100000
    smoke:
      enabled: false
      requested_total: 60000
      split_sizes:
        train: 50000
        val: 5000
        test: 5000
      verdict: READY_FOR_SMOKE_ONLY
    min_clean_pool_for_ready: 150000
    min_clean_pool_hard_min: 60000
    open_corpora_sources_path: configs/open_corpora_sources.yaml
    real_error_sources_path: configs/real_error_sources.yaml
    source_type_targets:
      synthetic_augmented_from_open_clean: 72000
      real_error_pair: 4000
      clean_identity_from_open_clean: 12000
      hard_negative_from_open_clean: 12000
    split_source_type_targets:
      train:
        synthetic_augmented_from_open_clean: 57600
        real_error_pair: 3200
        clean_identity_from_open_clean: 9600
        hard_negative_from_open_clean: 9600
      val:
        synthetic_augmented_from_open_clean: 7200
        real_error_pair: 400
        clean_identity_from_open_clean: 1200
        hard_negative_from_open_clean: 1200
      test:
        synthetic_augmented_from_open_clean: 7200
        real_error_pair: 400
        clean_identity_from_open_clean: 1200
        hard_negative_from_open_clean: 1200
    active_rule_quota:
      enabled: true
      strategy: tiered_canonical
      min_total_per_active_rule: 200
      preferred_total_per_active_rule: 1000
      split_minimums: {}
      tiers:
        stable_core:
          min_total_per_rule: 300
          preferred_total_per_rule: 700
          max_total_per_rule: 2500
        activation:
          min_total_per_rule: 500
          preferred_total_per_rule: 1000
          max_total_per_rule: 2500
        bounded_activation:
          min_total_per_rule: 200
          preferred_total_per_rule: 500
          max_total_per_rule: 1500
      risky_lexical:
        rule_ids:
        - dictionary_fuzzy
        - swapped_letters_candidate
        - double_consonant_candidate
        - missing_letter_candidate
        - extra_letter_candidate
        - keyboard_typo_candidate
        min_total_per_rule: 200
        preferred_total_per_rule: 500
        max_total_per_rule: 1200
    rule_caps:
      max_total_per_rule_id: 2500
      max_train_per_rule_id: 2000
      max_rule_share_train: 0.1
      max_error_type_share_train: 0.35
    pool:
      min_clean_sentences: 150000
      max_source_share: 0.6
      max_subcorpus_share: 0.7
    audit:
      candidate_recall_min: 0.85
      gap_coverage_min: 0.85
      synthetic_min: 70000
      min_active_rule_count: 1
      min_clean_identity_eval_split: 500
      min_hard_negative_eval_split: 500
      min_rows_for_template_gates: 1000
      min_rows_for_candidate_gates: 1000
      min_rows_for_eval_source_split_gates: 1000
      require_all_source_types: true
