project:
  name: russian-edit-corrector
  strict_scope:
  - spelling
  - punctuation
correction_memory:
  enabled: false
  storage_path: data/user/correction_memory.jsonl
  context_window_chars: 48
  accepted_reuse: true
  rejected_suppress: true
model:
  primary_encoder: ai-forever/ruRoberta-large
  fallback_encoder: ai-forever/ruRoberta-large
  local_files_only: false
  max_sequence_length: 128
  max_candidates: 16
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
dictionary:
  enabled: true
  lexicon_path: data/processed/russian_lexicon.txt
  max_candidates: 2
  min_score: 85
  max_choices_per_token: 5000
  use_second_letter_index: true
  token_cache:
    enabled: true
    max_size: 200000
  yo_e:
    enabled: false
    mode: model_required
    require_lexicon_support: true
    require_model_scoring: true
nlp:
  syntax:
    enabled: true
    backend: natasha
    cache_enabled: true
    cache_max_size: 50000
    cache_max_text_length: 20000
    fail_open: true
    debug_errors: false
training:
  mode: train
  run_model_training: true
  evaluation_split: val
  checkpoint_metric: combined_score
  max_train_examples: 192000
  max_val_examples: 24000
  max_test_examples: 24000
  batch_size: 128
  gradient_accumulation_steps: 1
  epochs: 3
  learning_rate: 5.0e-05
  mixed_precision: true
  show_progress: true
  progress_log_every_steps: 1000
  word_loss_weight: 1.3
  punctuation_loss_weight: 1.2
  punctuation_action_loss_weight: 0.8
  punctuation_focal_gamma: 1.5
  punctuation_action_focal_gamma: 1.0
  punctuation_label_weights:
  - 0.25
  - 2.0
  - 1.2
  - 3.0
  - 3.0
  - 4.0
  - 4.0
  - 5.0
  - 4.0
  - 4.0
  - 4.0
  - 4.0
  - 4.0
  punctuation_action_weights:
  - 0.25
  - 0.5
  - 2.0
  - 3.0
  - 3.0
  confidence_loss_weight: 0.3
  error_type_loss_weight: 0.5
  feature_build:
    profile: true
    profile_sample_size: 2000
    enable_syntax: true
    dictionary_for_clean_rows: false
    dictionary_for_hard_negative_rows: false
  feature_cache:
    enabled: true
    cache_dir: data/processed/features_cache
    include_dataset_hash: true
    include_config_hash: true
    compression: false
evaluation:
  batch_size: 256
  fast_during_training: false
  max_eval_examples_per_epoch: 1000
  full_eval_after_training: true
  full_eval_examples: 20000
  write_detailed_reports_during_training: false
  write_accepted_rejected_during_training: false
  write_score_distribution_during_training: false
  write_rule_worse_examples_during_training: false
data:
  candidate_opportunity:
    contract: candidate_opportunity
    dataset_build_workers: 8
    synthetic_seed: 13
    totals:
      total_examples: 240000
      train_examples: 192000
      val_examples: 24000
      test_examples: 24000
    paths:
      processed_dir: data/processed
      reports_dir: reports/dataset_build
      clean_pool_path: data/processed/clean_sentence_pool.csv.gz
      correction_dataset_path: data/processed/correction_dataset.csv.gz
      manifest_path: data/processed/dataset_manifest.json
      open_corpora_sources_config: configs/open_corpora_sources.yaml
      real_error_sources_config: configs/real_error_sources.yaml
      rule_lab_recipes_config: configs/rule_lab_recipes.yaml
    rule_activation:
      mode: expanded_safe
      include_decisions:
      - INCLUDE_NOW
      - INCLUDE_AFTER_THRESHOLD_CALIBRATION
      - INCLUDE_AFTER_TRAINING
      include_after_validator_when_runtime_supported: true
      require_candidate_path: true
      require_synthetic_support: true
      require_hard_negative_support: true
      require_validator_support_or_empirical_pass: true
      exclude_blocked: true
      exclude_ner_required_without_ner: true
      min_empirical_validator_passes: 3
      max_empirical_validator_examples: 10
      expected_min_production_ready_rule_count: 12
      expected_min_training_candidate_rule_count: 76
      target_training_candidate_rule_count: 76
      fail_below_min_training_candidate_rule_count: true
      warn_below_target_training_candidate_rule_count: true
      fail_below_final_active_rule_count: true
      expected_min_final_active_rule_count: 25
      target_final_active_rule_count: 76
      warn_below_target_final_active_rule_count: true
    composition:
      atomic_positive_ratio: 0.475
      atomic_hard_negative_ratio: 0.25
      clean_identity_ratio: 0.195
      stress_multi_error_ratio: 0.05
      real_atomic_train_ratio: 0.03
      allow_layer_target_adjustment: true
      fail_on_unadjusted_layer_deficit: true
    clean_pool:
      reject_mixed_script_tokens: true
      reject_latin_confusable_inside_cyrillic_word: true
      reject_if_candidate_generator_finds_high_confidence_fix: true
      high_confidence_candidate_threshold: 0.95
    synthetic:
      require_atomic_positive: true
      max_gold_edits_for_atomic: 1
      require_candidate_coverage: true
      require_strict_validator_acceptance: true
    real_pairs:
      train_policy: atomize_single_edit_known_rule_only
      unknown_rule_policy: mining_only
      multi_edit_policy: stress_or_eval_only
    stress:
      enabled: true
      count_toward_rule_quota: false
      loss_weight: 0.4
      min_ratio: 0.03
      max_ratio: 0.05
      fail_on_under_target: false
    rule_quota:
      min_atomic_positives_per_active_rule: 500
      preferred_atomic_positives_per_active_rule: 1500
      max_total_per_rule_id: 1500
      min_hard_negatives_per_active_rule: 200
      disable_rule_if_quota_not_met: true
    rule_data_compiler:
      enabled: true
      source_priority:
      - corpus_mined
      - syntax_mined
      - morphology_mined
      - real_pattern_replay
      - rule_lab
      max_rule_lab_share_per_rule: 0.30
      fail_on_high_rule_lab_share: false
      min_unique_sentence_patterns_per_rule: 20
      min_unique_left_contexts_per_rule: 100
      min_unique_right_contexts_per_rule: 100
      max_near_duplicate_share: 0.02
      fail_on_low_structural_diversity: false
    rule_lab:
      enabled: true
      fill_underfilled_rules: true
      max_generated_per_rule: 1500
      max_hard_negatives_per_rule: 500
      prefer_rule_lab_for_underfilled: true
      max_rule_lab_share_per_rule: 0.30
      fail_on_high_rule_lab_share: false
      fail_on_low_diversity: true
      max_per_template_share: 0.25
      max_per_slot_value_share: 0.35
      context_injection_max_share: 0.50
    audit:
      fail_on_extra_edits_in_atomic: true
      fail_on_unknown_rule_in_train: true
      fail_on_stale_reports: true
      min_candidate_recall_for_active_rule: 0.95
      fail_on_corpus_opportunity_share_below_threshold: false
      destructive_diversity_pruning_enabled: false
