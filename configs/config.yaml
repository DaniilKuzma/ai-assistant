decoder:
  max_passes: 3
labels:
  punctuation:
    NONE: 0
    COMMA: 1
    DOT: 2
    QUESTION: 3
    EXCLAMATION: 4
    COLON: 5
    DASH: 6
    SEMICOLON: 7
    ELLIPSIS: 8
    QUOTE_OPEN: 9
    QUOTE_CLOSE: 10
    BRACKET_OPEN: 11
    BRACKET_CLOSE: 12
  punctuation_actions:
    KEEP_NONE: 0
    KEEP_EXISTING: 1
    INSERT: 2
    DELETE: 3
    REPLACE: 4
  error_types:
    keep: 0
    spelling: 1
    punctuation: 2
    split_join: 3
    hyphen: 4
    case: 5
    final_punctuation: 6
metrics:
  combined_score_weights:
    exact_match: 1.0
    edit_f1: 1.0
    spelling_f1: 1.0
    punctuation_f1: 1.0
    dirty_improved_rate: 1.0
    dirty_worse_rate: -2.0
    clean_overcorrection_rate: -3.0
paths:
  adapter_output_dir: models/current/adapters
  heads_output_dir: models/current/heads
  reports_dir: reports
