project:
  name: russian-edit-corrector
  strict_scope:
    - spelling
    - punctuation

model:
  primary_encoder: ai-forever/ruRoberta-large
  fallback_encoder: ai-forever/ruBert-base
  local_files_only: true
  max_sequence_length: 128
  max_candidates: 16
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05

training:
  mode: full-train
  run_model_training: true
  checkpoint_metric: combined_score
  max_train_examples: 10000
  max_val_examples: 1000
  max_test_examples: 1000
  batch_size: 64
  gradient_accumulation_steps: 1
  epochs: 3
  learning_rate: 0.0001
  mixed_precision: true
  show_progress: true
  progress_log_every_steps: 1000
  word_loss_weight: 1.0
  punctuation_loss_weight: 1.0
  confidence_loss_weight: 0.3
  error_type_loss_weight: 0.5

data:
  synthetic_seed: 13
  processed_train_path: data/processed/correction_dataset.csv.gz
  manifest_path: reports/dataset_manifest.json
  target_total_examples: 450000
  clean_identity_ratio: 0.10
  val_ratio: 0.05
  test_ratio: 0.05
  domain: synthetic_general
  use_external_sources: true
  max_external_examples: 10000
  clean_corpus:
    enabled: true
    cache_path: data/raw/clean_corpus_sentences.txt.gz
    rebuild_cache: false
    min_cached_sentences: 10000
    max_source_sentences: 1200000
    sources:
      - name: leipzig_news
        type: leipzig
        corpus_ids:
          - rus_news_2022_1M
          - rus_news_2021_1M
          - rus_news_2020_1M
        max_sentences: 180000
      - name: leipzig_wikipedia
        type: leipzig
        corpus_ids:
          - rus_wikipedia_2021_1M
          - rus_wikipedia_2016_1M
        max_sentences: 90000
      - name: taiga_rest
        type: hf_dataset
        repo: cointegrated/taiga_stripped_rest
        splits:
          - Interfax
          - Lenta
          - NPlus1
          - Fontanka
          - Arzamas
          - KP
        text_fields:
          - text
        max_sentences: 90000
      - name: taiga_proza_filtered
        type: hf_dataset
        repo: cointegrated/taiga_stripped_proza
        splits:
          - train
        text_fields:
          - text
        max_sentences: 15000
        strict_formal_filter: true
      - name: ud_russian_taiga
        type: ud_conllu
        urls:
          - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-train.conllu
          - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-dev.conllu
          - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-test.conllu
        max_sentences: 25000
      - name: opencorpora
        type: opencorpora_xml_zip
        url: https://opencorpora.org/files/export/annot/annot.opcorpora.xml.zip
        max_sentences: 40000
  debug_clean_texts:
    - Я не знаю, что делать.
    - Во-первых, это важно.
    - Чистый текст.

thresholds:
  mode: balanced
  conservative:
    spelling_threshold: 0.92
    punctuation_threshold: 0.90
    split_join_threshold: 0.95
    hyphen_threshold: 0.95
    case_threshold: 0.90
  balanced:
    spelling_threshold: 0.85
    punctuation_threshold: 0.82
    split_join_threshold: 0.88
    hyphen_threshold: 0.88
    case_threshold: 0.85
  aggressive:
    spelling_threshold: 0.75
    punctuation_threshold: 0.72
    split_join_threshold: 0.80
    hyphen_threshold: 0.80
    case_threshold: 0.78

decoder:
  max_passes: 3

labels:
  punctuation:
    NONE: 0
    COMMA: 1
    DOT: 2
    QUESTION: 3
    EXCLAMATION: 4
    COLON: 5
    DASH: 6
    SEMICOLON: 7
    ELLIPSIS: 8
    QUOTE_OPEN: 9
    QUOTE_CLOSE: 10
    BRACKET_OPEN: 11
    BRACKET_CLOSE: 12
  error_types:
    keep: 0
    spelling: 1
    punctuation: 2
    split_join: 3
    hyphen: 4
    case: 5
    final_punctuation: 6

metrics:
  combined_score_weights:
    exact_match: 1.0
    edit_f1: 1.0
    spelling_f1: 1.0
    punctuation_f1: 1.0
    dirty_improved_rate: 1.0
    dirty_worse_rate: -2.0
    clean_overcorrection_rate: -3.0

paths:
  adapter_output_dir: models/adapters/latest
  heads_output_dir: models/heads/latest
  reports_dir: reports
