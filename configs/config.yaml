project:
  name: russian-edit-corrector
  strict_scope: [spelling, punctuation]

model:
  encoder: ai-forever/ruRoberta-large
  local_files_only: false
  max_sequence_length: 128
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05

generation:
  mode: online_ast
  seed: 13
  samples_per_epoch: 75000
  frozen_eval:
    val_examples: 5000
    test_examples: 5000
    regression_examples: 1500
    coverage_examples_per_rule: 8
    output_dir: data/generated_eval
  enabled_rule_groups:
    - deterministic_orthography
    - contextual_orthography
    - morpheme
    - orthography_morphemic
    - compound_spelling
    - dictionary_typo
    - punctuation
    - syntax_punctuation
    - quotation_dialogue
    - casing
    - semantic
  mix:
    orthography_contextual: 0.16
    morpheme: 0.12
    compound_spelling: 0.12
    dictionary_typo: 0.12
    punctuation: 0.22
    syntax_punctuation: 0.12
    quotation_dialogue: 0.08
    casing: 0.06
    semantic: 0.08
    clean_identity: 0.15
    hard_negative: 0.10
  rule_weight_overrides:
    dash_subject_predicate: 0.25
    morpheme_endings: 0.75
    morpheme_hissing_vowels: 0.80
    morpheme_soft_hard_signs: 0.80
    morpheme_consonants: 0.80
    morpheme_prefixes: 0.85
    morpheme_n_nn: 0.90
    punct_detached_adverbials: 1.25
    punct_address_interjection: 1.20
    punct_bsp: 0.85
    punct_fixed_expression_guards: 0.85
    dialogue_author_inside_speech: 0.35
  sampling_exclude_rule_ids:
    - ne_verb
    - takzhe_tak_zhe
    - tozhe_to_zhe
    - zato_za_to
    - hyphen_particles
    - hyphen_koe
    - hyphen_po_adverb
  orthography_morphemic:
    enabled: true
    weight: 0.25
    rules:
      - suffix_its_ets
      - suffix_enn_yan
      - n_nn_basic
      - morpheme_hissing_vowels
      - morpheme_soft_hard_signs
      - morpheme_root_vowels
      - morpheme_prefixes
      - morpheme_suffixes
      - morpheme_n_nn
      - morpheme_consonants
      - morpheme_endings
  rule_layers:
    enabled: true
    root: lexicon/layers
    layers: []
    groups:
      compound_spelling:
        enabled: true
        layers:
          - compound_spelling
      morpheme:
        enabled: false
        layers: []
      dictionary_typo:
        enabled: true
        layers:
          - dictionary_typo
      syntax_punctuation:
        enabled: true
        layers:
          - syntax_punctuation
      quotation_dialogue:
        enabled: true
        layers:
          - quotation_dialogue
      casing:
        enabled: true
        layers:
          - casing
      semantic:
        enabled: true
        layers:
          - semantic
  grammar:
    max_sentence_words: 28
    min_sentence_words: 3
    reject_ungrammatical: true
    max_generation_retries: 20
    use_pymorphy: true

training:
  mode: online
  batch_size: 32
  eval_batch_size: 64
  epochs: 4
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.08
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: true
  num_workers: 0
  progress_log_interval_seconds: 60
  progress_log_interval_steps: 250
  save_each_epoch: true
  validate_each_epoch: true
  token_edit_loss_weight: 1.0
  gap_punctuation_loss_weight: 1.2
  boundary_before_loss_weight: 1.0
  boundary_after_loss_weight: 1.0
  rule_loss_weight: 0.3
  smoke_steps: 3

runtime:
  max_passes: 2
  deterministic_first: true
  deterministic_lexicon: true
  deterministic_final_punctuation: true
  neural_token_edits: true
  neural_punctuation: true
  confidence_thresholds:
    token_edit: 0.70
    punctuation: 0.60

paths:
  generated_eval_dir: data/generated_eval
  checkpoint_output_dir: models/checkpoints
  adapter_output_dir: models/adapters/latest
  heads_output_dir: models/heads/latest
  lexicon_dir: lexicon
