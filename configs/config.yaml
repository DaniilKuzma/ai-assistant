project:
  name: russian-edit-corrector
  strict_scope:
    - spelling
    - punctuation

model:
  primary_encoder: ai-forever/ruRoberta-large
  fallback_encoder: ai-forever/ruRoberta-large
  local_files_only: false
  max_sequence_length: 128
  max_candidates: 16
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05

training:
  mode: full-train
  run_model_training: true
  evaluation_split: test
  checkpoint_metric: combined_score
  max_train_examples: 250000
  max_val_examples: 10000
  max_test_examples: 10000
  batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 2
  learning_rate: 0.0001
  mixed_precision: true
  show_progress: true
  progress_log_every_steps: 1000
  word_loss_weight: 1.3
  punctuation_loss_weight: 1.2
  punctuation_action_loss_weight: 0.8
  punctuation_focal_gamma: 1.5
  punctuation_action_focal_gamma: 1.0
  punctuation_label_weights: [0.25, 2.0, 1.2, 3.0, 3.0, 4.0, 4.0, 5.0, 4.0, 4.0, 4.0, 4.0, 4.0]
  punctuation_action_weights: [0.25, 0.5, 2.0, 3.0, 3.0]
  confidence_loss_weight: 0.3
  error_type_loss_weight: 0.5

data:
  synthetic_seed: 13
  processed_train_path: data/processed/correction_dataset.csv.gz
  manifest_path: reports/dataset_manifest.json
  target_total_examples: 450000
  clean_identity_ratio: 0.10
  synthetic_balance:
    spelling_min_examples: 60000
    split_join_min_examples: 20000
    hyphen_min_examples: 20000
    orthography_groups:
      ne_verb_min_examples: 8000
      tsya_min_examples: 6000
      combo_min_examples: 8000
      hard_sign_min_examples: 6000
      prefix_z_s_min_examples: 6000
      ci_min_examples: 4000
      hissing_o_e_min_examples: 5000
    punctuation_groups:
      comma_subordinate_min_examples: 20000
      comma_conjunction_min_examples: 15000
      introductory_min_examples: 10000
      colon_min_examples: 8000
      dash_min_examples: 8000
      semicolon_min_examples: 5000
      quotes_brackets_min_examples: 8000
      final_punctuation_min_examples: 20000
      delete_replace_min_examples: 15000
  punctuation_hard_negative_clean_ratio: 0.20
  val_ratio: 0.05
  test_ratio: 0.05
  domain: synthetic_general
  use_external_sources: true
  max_external_examples: 10000
  external_sources:
    - name: rus_spell_gold
      type: hf_jsonl
      repo: RussianNLP/RuSpellGold
      files:
        - data/complete_test/test.json
      max_examples: 2000
    - name: ai_forever_spellcheck_punctuation
      type: hf_jsonl
      repo: ai-forever/spellcheck_punctuation_benchmark
      files:
        - data/RUSpellRU/train.json
        - data/RUSpellRU/test.json
        - data/MultidomainGold/train.json
        - data/MultidomainGold/test.json
      max_examples: 6000
    - name: lorugec_val
      type: m2
      path: data/raw/external/LORuGEC.val.m2
      url: https://raw.githubusercontent.com/ReginaNasyrova/LORuGEC/main/LORuGEC.val.m2
      max_examples: 1000
    - name: lorugec_test
      type: m2
      path: data/raw/external/LORuGEC.test.m2
      url: https://raw.githubusercontent.com/ReginaNasyrova/LORuGEC/main/LORuGEC.test.m2
      max_examples: 1000
    - name: github_typo_corpus_ru
      type: github_typo_jsonl_gz
      path: data/raw/external/github-typo-corpus.v1.0.0.jsonl.gz
      url: https://github-typo-corpus.s3.amazonaws.com/data/github-typo-corpus.v1.0.0.jsonl.gz
      max_examples: 500
    - name: mendeley_russian_spelling_test
      type: csv
      path: data/raw/external/test_pairs.csv
      url: https://data.mendeley.com/public-files/datasets/mpwdrr6y3v/files/1ca956a8-3bf7-46e6-8478-04f29856f4e8/file_downloaded
      trusted_word_pairs: true
      max_examples: 5000
    - name: mendeley_russian_spelling_train
      type: csv
      path: data/raw/external/train_pairs.csv
      url: https://data.mendeley.com/public-files/datasets/mpwdrr6y3v/files/d7763910-8ea7-459b-8ec1-946c39e03ef9/file_downloaded
      trusted_word_pairs: true
      max_examples: 5000
  clean_corpus:
    enabled: true
    cache_path: data/raw/clean_corpus_sentences.txt.gz
    rebuild_cache: false
    min_cached_sentences: 10000
    max_source_sentences: 1200000
    sources:
      - name: leipzig_news
        type: leipzig
        corpus_ids:
          - rus_news_2022_1M
          - rus_news_2021_1M
          - rus_news_2020_1M
        max_sentences: 180000
      - name: leipzig_wikipedia
        type: leipzig
        corpus_ids:
          - rus_wikipedia_2021_1M
          - rus_wikipedia_2016_1M
        max_sentences: 90000
      - name: taiga_rest
        type: hf_dataset
        repo: cointegrated/taiga_stripped_rest
        splits:
          - Interfax
          - Lenta
          - NPlus1
          - Fontanka
          - Arzamas
          - KP
        text_fields:
          - text
        max_sentences: 90000
      - name: taiga_proza_filtered
        type: hf_dataset
        repo: cointegrated/taiga_stripped_proza
        splits:
          - train
        text_fields:
          - text
        max_sentences: 15000
        strict_formal_filter: true
      - name: ud_russian_taiga
        type: ud_conllu
        urls:
          - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-train.conllu
          - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-dev.conllu
          - https://raw.githubusercontent.com/UniversalDependencies/UD_Russian-Taiga/master/ru_taiga-ud-test.conllu
        max_sentences: 25000
      - name: opencorpora
        type: opencorpora_xml_zip
        url: https://opencorpora.org/files/export/annot/annot.opcorpora.xml.zip
        max_sentences: 40000
      - name: tatoeba_russian
        type: tatoeba_tsv
        url: https://downloads.tatoeba.org/exports/sentences.tar.bz2
        max_sentences: 30000
      - name: russian_wikipedia_dump
        type: mediawiki_xml_bz2
        url: https://dumps.wikimedia.org/ruwiki/latest/ruwiki-latest-pages-articles-multistream.xml.bz2
        max_sentences: 50000
        enabled: false
  debug_clean_texts:
    - Я не знаю, что делать.
    - Во-первых, это важно.
    - Чистый текст.

thresholds:
  mode: balanced
  conservative:
    spelling_threshold: 0.92
    punctuation_threshold: 0.90
    comma_threshold: 0.90
    final_punctuation_threshold: 0.88
    colon_threshold: 0.92
    dash_threshold: 0.94
    semicolon_threshold: 0.95
    quote_threshold: 0.94
    bracket_threshold: 0.94
    punctuation_delete_threshold: 0.98
    split_join_threshold: 0.95
    context_pair_threshold: 0.995
    hyphen_threshold: 0.95
    case_threshold: 0.90
  balanced:
    spelling_threshold: 0.78
    punctuation_threshold: 0.86
    comma_threshold: 0.86
    final_punctuation_threshold: 0.84
    colon_threshold: 0.88
    dash_threshold: 0.90
    semicolon_threshold: 0.92
    quote_threshold: 0.90
    bracket_threshold: 0.90
    punctuation_delete_threshold: 0.95
    split_join_threshold: 0.84
    context_pair_threshold: 0.98
    hyphen_threshold: 0.84
    case_threshold: 0.85
  aggressive:
    spelling_threshold: 0.75
    punctuation_threshold: 0.72
    comma_threshold: 0.72
    final_punctuation_threshold: 0.70
    colon_threshold: 0.76
    dash_threshold: 0.80
    semicolon_threshold: 0.84
    quote_threshold: 0.82
    bracket_threshold: 0.82
    punctuation_delete_threshold: 0.90
    split_join_threshold: 0.80
    context_pair_threshold: 0.97
    hyphen_threshold: 0.80
    case_threshold: 0.78

decoder:
  max_passes: 3

labels:
  punctuation:
    NONE: 0
    COMMA: 1
    DOT: 2
    QUESTION: 3
    EXCLAMATION: 4
    COLON: 5
    DASH: 6
    SEMICOLON: 7
    ELLIPSIS: 8
    QUOTE_OPEN: 9
    QUOTE_CLOSE: 10
    BRACKET_OPEN: 11
    BRACKET_CLOSE: 12
  punctuation_actions:
    KEEP_NONE: 0
    KEEP_EXISTING: 1
    INSERT: 2
    DELETE: 3
    REPLACE: 4
  error_types:
    keep: 0
    spelling: 1
    punctuation: 2
    split_join: 3
    hyphen: 4
    case: 5
    final_punctuation: 6

metrics:
  combined_score_weights:
    exact_match: 1.0
    edit_f1: 1.0
    spelling_f1: 1.0
    punctuation_f1: 1.0
    dirty_improved_rate: 1.0
    dirty_worse_rate: -2.0
    clean_overcorrection_rate: -3.0

paths:
  adapter_output_dir: models/adapters/latest
  heads_output_dir: models/heads/latest
  reports_dir: reports
