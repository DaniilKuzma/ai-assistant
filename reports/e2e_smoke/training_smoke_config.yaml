project:
  name: russian-edit-corrector
  strict_scope:
  - spelling
  - punctuation
model:
  encoder: ai-forever/ruRoberta-large
  local_files_only: true
  max_sequence_length: 64
  lora:
    enabled: false
    r: 8
    alpha: 16
    dropout: 0.05
generation:
  mode: online_ast
  seed: 13
  samples_per_epoch: 200000
  frozen_eval:
    val_examples: 5000
    test_examples: 5000
    regression_examples: 1000
    output_dir: data/generated_eval
  enabled_rule_groups:
  - deterministic_orthography
  - contextual_orthography
  - punctuation
  mix:
    orthography_contextual: 0.35
    punctuation: 0.4
    clean_identity: 0.15
    hard_negative: 0.1
  grammar:
    max_sentence_words: 28
    min_sentence_words: 3
    reject_ungrammatical: true
    max_generation_retries: 20
training:
  mode: online
  batch_size: 2
  eval_batch_size: 2
  epochs: 1
  learning_rate: 5.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.06
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: false
  num_workers: 0
  save_each_epoch: false
  validate_each_epoch: true
  token_edit_loss_weight: 1.0
  gap_punctuation_loss_weight: 1.2
  rule_loss_weight: 0.3
  smoke_steps: 3
runtime:
  max_passes: 2
  deterministic_first: true
  neural_token_edits: true
  neural_punctuation: true
  confidence_thresholds:
    token_edit: 0.7
    punctuation: 0.7
  correction_memory:
    enabled: false
    storage_path: data/user/correction_memory.jsonl
paths:
  generated_eval_dir: reports\e2e_smoke
  adapter_output_dir: reports\e2e_smoke\models\adapters
  heads_output_dir: reports\e2e_smoke\models\heads
  lexicon_dir: lexicon
