[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-edit-corrector"
version = "0.1.0"
description = "AST-first Russian spelling and punctuation corrector with direct edit tagging."
requires-python = ">=3.10"
readme = "AI_INDEX.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
